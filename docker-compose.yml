version: '3.8'

services:
  gateway:
    build: .
    container_name: mani-api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - mani-network
    depends_on:
      - core-service
      - rules-service
      - dispatch-service

  core-service:
    image: mani-core-node:local
    container_name: mani-core-service
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - mani-network

  rules-service:
    image: mani-rules-java:local
    container_name: mani-rules-service
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - mani-network

  dispatch-service:
    image: mani-dispatch-dotnet:local
    container_name: mani-dispatch-service
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - mani-network

  # ---------------------------------------------------------------------
  # Base de datos local (perfil "db"). Traída desde MANI-Flutter (CFG-33).
  # Levantar solo la BD:  docker compose --profile db up -d
  # Los scripts de scripts/ invocan "docker compose up -d postgres", que
  # activa el perfil al nombrar el servicio.
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: mani-postgres
    restart: unless-stopped
    profiles: ["db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mani_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mani_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mani-network

  # Administrador web de la BD: http://localhost:8088
  adminer:
    image: adminer:latest
    container_name: mani-adminer
    restart: unless-stopped
    profiles: ["db"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    networks:
      - mani-network

  # Cliente Flutter Web (perfil "web"). La imagen se construye en MANI-Flutter:
  #   docker build -t mani-web:local .
  mani-web:
    image: mani-web:local
    container_name: mani-web
    restart: unless-stopped
    profiles: ["web"]
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - mani-network

networks:
  mani-network:
    driver: bridge

volumes:
  postgres_data:
    name: mani_postgres_data
