              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol no es aliado (`MANI-EJE-403`) o no es el aliado asignado (`MANI-EJE-403A`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La solicitud no existe en el tenant del JWT (`MANI-EJE-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Cotización sin aceptar u otro estado (`MANI-EJE-409E`), ya iniciada (`MANI-EJE-409I`) o ya finalizada (`MANI-EJE-409F`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
