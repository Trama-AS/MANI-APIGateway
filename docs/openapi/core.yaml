              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-COT-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol no es cliente (`MANI-COT-403`) o la cuenta no es un cliente activo del tenant (`MANI-COT-403C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La cotización no existe o no es de una solicitud del cliente (`MANI-COT-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La cotización ya fue respondida (`MANI-COT-409R`) o la solicitud no está en `COTIZANDO` (`MANI-COT-409E`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
