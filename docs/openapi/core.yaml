openapi: 3.0.3
info:
  title: MANI-APIGateway — Identidad y Registro de Aliado (Core)
  description: >
    Contrato OpenAPI entre MANI-APIGateway y MANI-Node (Core) para el dominio
    de identidad: autenticación y registro de aliado persona natural. Vive en
    este repositorio (CFG-16) porque el Gateway es el límite público del
    contrato; MANI-Node lo implementa pero no lo posee.


    ## Propagación del claim de tenant

    MANI es multi-tenant: cada petición debe resolverse en el contexto de un
    tenant (organización) específico, y el Core nunca puede confiar en un
    valor de tenant que un cliente final pueda falsificar.

    1. **Pre-autenticación** (`POST /auth/login`, `POST /auth/register/ally`):
       el llamador todavía no tiene un JWT. Conforme a ADR-0018, el tenant se identifica
       con el header `X-Tenant-Slug` (slug público del tenant, ej. `trama-demo`),
       descartando el uso de IDs internos confiados por el backend para evitar spoofing.
       El Core responde `400 TENANT_NOT_FOUND` si el tenant no existe o está
       inactivo.
    2. **Emisión del claim**: si el login o el registro son exitosos, Supabase
       Auth emite un `accessToken` (JWT) cuyo payload incluye, bajo
       `app_metadata`, el claim `tenant_id` con el id del tenant resuelto en
       el paso anterior (ver `TokenClaims`; el Custom Access Token Hook de
       Supabase, CFG-12, es quien lo puebla). Ese mismo id se refleja en
       `ProfileSummary.tenantId` en la respuesta.
    3. **Post-autenticación** (`POST /auth/refresh`, `POST /auth/logout`, y
       en general cualquier endpoint protegido con `bearerAuth`): el tenant
       se deriva **exclusivamente** del claim dentro del JWT ya verificado.
       El Core ignora cualquier header `X-Tenant-Id` enviado en estas
       llamadas — aceptarlo permitiría a un cliente autenticado en el tenant
       A leer/escribir datos del tenant B con solo cambiar un header.

    Esta regla (tenant por header solo pre-auth; tenant por claim de JWT ya
    autenticado) es la que deben implementar tanto el Gateway como el Core.
  version: 0.19.0
servers:
  - url: https://api.mani.app/api/v1/core
    description: Producción, vía MANI-APIGateway
  - url: http://localhost/api/v1/core
    description: Gateway local (docker compose up -d gateway core-service)

tags:
  - name: Auth
    description: >
      Autenticación e identidad de usuarios (Clientes, Aliados, Admins).

      El inicio de sesión y la renovación del token NO están en este contrato
      y no son de Core: conforme a ADR-0031, el emisor del JWT es Supabase
      Auth (GoTrue), y el cliente Flutter habla con él directamente. La única
      excepción aprobada para que Core firme un token es
      `/api/v1/auth/dev-token`, limitada a desarrollo, pruebas y CI.

      Lo que sí expone Core en este dominio: registro (que delega la emisión
      del token en Supabase Auth), cierre de sesión, recuperación y cambio de
      contraseña, y `validate-token`, que es la consulta interna que hace el
      Gateway con `auth_request` y no se llama desde el cliente.
  - name: Ally Registration
    description: Registro de Aliados persona natural y empresa
  - name: Client Registration
    description: Registro de Clientes persona natural y empresa
  - name: Service Requests
    description: Creación de solicitudes de servicio por el cliente (US-04.1.1-M2 / SCRUM-1072)
  - name: Payments
    description: >
      Pagos del cliente en el sandbox simulado (HU-M11-01 / SCRUM-1432, RF-24). El proveedor es un mock: no mueve
      dinero ni recibe datos de tarjeta, y cada pago y comprobante se identifica como simulado. Tenant, cliente y rol
      salen del JWT; el monto sale de la cotización.
  - name: Messaging
    description: >
      Mensajería entre el cliente y el aliado de un servicio (HU-M09-02 / SCRUM-881, RF-20). Core guarda los mensajes
      y el otro participante los recibe consultando el hilo cada pocos segundos con `despuesDe` (sin tiempo real).
      Solo participan el cliente dueño de la solicitud y el aliado asignado; tenant, usuario y rol salen del JWT.
  - name: Ally Availability
    description: Intervalos en los que el aliado está "No disponible" (US-02.1.6 / SCRUM-855)
  - name: Geographic Zones
    description: >
      Catálogo jerárquico de zonas geográficas (HU-M04-04 / REST-01). Solo
      lectura: el catálogo lo administra la infraestructura de datos, no Core.
      La tabla `zona` es global (sin `tenant_id`), así que la respuesta no
      depende del tenant; la ruta exige JWT para no confiar en un tenant ni un
      rol enviados por el cliente.
  - name: Service Categories
    description: >
      Catálogo de categorías de servicio (US-03.1.1-M2 / SCRUM-1069). La
      gestión vive en Core, aislada por el tenant del JWT; la evaluación de
      reglas de la categoría es del Rules Service (`rules.yaml`).
  - name: Legal
    description: >
      Documentos legales y consentimiento de Habeas Data (US-02.3.2 /
      SCRUM-856, Ley 1581 de 2012).
  - name: Client Sites
    description: >
      Sedes del cliente empresa (US-02.2.2 / SCRUM-852, HU-M03-04 /
      SCRUM-1387, RF-08). Toda sede tiene dirección y zona del catálogo
      (RF-09). Solo las consultan y modifican el propio cliente empresa y el
      administrador de su tenant; el tenant, el usuario y el rol salen del JWT.

paths:
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Registra el cierre de sesión para auditoría
      description: >
        Deja constancia del cierre de sesión (HU-M02-03 / RF-03 / RNF-04): quién cerró sesión, en qué tenant y
        cuándo, tomados del JWT verificado; el cuerpo se ignora. **No revoca la sesión**: la revoca el cliente con
        `supabase.auth.signOut()`, porque el proveedor de identidad es el dueño de la sesión. Esta llamada es
        best-effort: si falla, el cliente cierra la sesión igualmente. Aunque `/auth/` es público en el Gateway,
        Core exige y verifica el `Authorization: Bearer`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '204':
          description: Cierre de sesión registrado
        '401':
          description: accessToken ausente, inválido o expirado (`UNAUTHORIZED` / `TOKEN_INVALID` / `TOKEN_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password-recovery:
    post:
      tags: [Auth]
      operationId: requestPasswordRecovery
      summary: Solicita el enlace de recuperación de contraseña
      description: >
        Pide al proveedor de identidad que envíe al correo un enlace para restablecer la contraseña
        (HU-M02-10 / RF-04). Es pre-autenticación: el tenant se resuelve por `X-Tenant-Slug` (ADR-0018).
        **Responde `202` con el mismo mensaje exista o no la cuenta**, para no revelar qué correos están
        registrados; el enlace solo se envía si la cuenta existe y está activa en ese tenant. Tampoco se
        devuelve `429` cuando el proveedor limita los envíos de una cuenta, porque ese límite solo ocurre
        cuando la cuenta existe y delataría qué correos están registrados.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '202':
          description: Solicitud aceptada (no confirma que la cuenta exista)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Correo inválido (`VALIDATION_ERROR`) o tenant inexistente/inactivo (`TENANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/password-reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Fija la contraseña nueva con el token del enlace de recuperación
      description: >
        Restablece la contraseña con el token que trae el enlace del correo (HU-M02-10 / RF-04). Es
        pre-autenticación: el tenant se resuelve por `X-Tenant-Slug` y debe ser el de la cuenta dueña del token,
        de modo que un enlace de un tenant no sirve en otro. Un token de sesión normal (inicio de sesión con
        contraseña) no es válido. El enlace deja de servir una vez usado: al restablecer la contraseña se
        revoca la sesión del enlace, sin cerrar las demás sesiones de la persona.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: >
            Datos inválidos (`VALIDATION_ERROR`: falta el token, o la contraseña tiene menos de 8 caracteres) o
            contraseña que no cumple la política del proveedor (`WEAK_PASSWORD`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >
            Token inválido, vencido, ya usado, de una cuenta de otro tenant o de una cuenta inactiva
            (`INVALID_RECOVERY_TOKEN`); no se distingue entre estos casos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/ally:
    post:
      tags: [Ally Registration]
      operationId: registerAllyNaturalPerson
      summary: Registra un nuevo Aliado persona natural
      description: >
        Crea el usuario y el perfil de Aliado (rol ALLY) en estado PENDING,
        a la espera de verificación KYC, dentro del tenant resuelto por
        `X-Tenant-Slug` (ADR-0018). Acepta `multipart/form-data` porque el registro
        incluye la subida de documentos KYC (cédula obligatoria, otros
        opcionales); el campo de cada archivo es su tipo de documento en
        minúsculas (p. ej. `cedula_ciudadania`). Devuelve tokens de sesión
        (con el claim `tenant_id` ya embebido) para que el Aliado pueda
        continuar el flujo de onboarding inmediatamente.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterAllyNaturalPersonRequest'
            encoding:
              cedula_ciudadania:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        '201':
          description: Aliado registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAllyResponse'
        '400':
          description: >
            Body inválido (`VALIDATION_ERROR`), términos y condiciones no
            aceptados (`TERMS_NOT_ACCEPTED`), tenant inexistente/inactivo
            (`TENANT_NOT_FOUND`) o categoría inexistente/inactiva
            (`CATEGORY_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Ya existe un usuario del tenant con ese email
            (`EMAIL_ALREADY_REGISTERED`) o, si se envió `documentNumber`, ya
            existe un aliado con ese número de documento
            (`DOCUMENT_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/ally/company:
    post:
      tags: [Ally Registration]
      operationId: registerAllyCompany
      summary: Registra un nuevo Aliado empresa (persona jurídica)
      description: >
        Crea el usuario y el perfil de Aliado empresa (rol ALLY) en estado PENDING,
        con sus documentos KYC (Cámara de Comercio obligatoria) y datos del representante
        legal, dentro del tenant resuelto por `X-Tenant-Slug` (ADR-0018 / US-02.1.2-M2).
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterAllyCompanyRequest'
            encoding:
              camara_comercio:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        '201':
          description: Aliado empresa registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAllyResponse'
        '400':
          description: >
            Body inválido (`VALIDATION_ERROR`), tenant inexistente/inactivo
            (`TENANT_NOT_FOUND`) o categoría inexistente/inactiva
            (`CATEGORY_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Ya existe un usuario con ese email (`EMAIL_ALREADY_REGISTERED`)
            o la empresa ya está registrada con ese NIT en este tenant
            (`COMPANY_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/client:
    post:
      tags: [Client Registration]
      operationId: registerClient
      summary: Registra un nuevo Cliente persona natural
      description: >
        Crea el usuario y el perfil de Cliente (rol CLIENT), activo de inmediato porque no
        pasa por KYC, dentro del tenant resuelto por `X-Tenant-Slug` (ADR-0018 / US-02.2.1-M2).
        Si se envía `direccionHogar`, se crea el primer sitio del cliente.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAllyResponse'
        '400':
          description: Body inválido (`VALIDATION_ERROR`) o tenant inexistente/inactivo (`TENANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya existe un usuario con ese email en el tenant (`EMAIL_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/client/company:
    post:
      tags: [Client Registration]
      operationId: registerClientCompany
      summary: Registra un nuevo Cliente empresa (persona jurídica)
      description: >
        Crea la identidad y el perfil de Cliente empresa (rol CLIENT) con NIT y representante legal,
        activo de inmediato, y registra la aceptación de términos y condiciones, dentro del tenant
        resuelto por `X-Tenant-Slug` (ADR-0018 / HU-M02-07). No crea sitios: las sedes se
        administran después con `POST /clients/{id}/sites`.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientCompanyRequest'
      responses:
        '201':
          description: Cliente empresa registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterClientCompanyResponse'
        '400':
          description: >
            Body inválido (`VALIDATION_ERROR`), términos sin aceptar (`TERMS_NOT_ACCEPTED`)
            o tenant inexistente/inactivo (`TENANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Ya existe un usuario con ese email (`EMAIL_ALREADY_REGISTERED`) o la empresa ya está
            registrada con ese NIT en este tenant (`COMPANY_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /solicitudes:
    post:
      tags: [Service Requests]
      operationId: createServiceRequest
      summary: El cliente crea una solicitud de servicio
      description: >
        Crea la solicitud en estado `PENDIENTE` en Core (ARQ-03: Core crea la solicitud, Dispatch la orquesta
        después). Porta la función `crear_solicitud` al servicio (ADR-0022): el tenant y el cliente salen del
        JWT (`bearerAuth`), nunca del cuerpo ni de `X-Tenant-Id`. La ubicación es un sitio propio del cliente
        (`sitioId`) o una dirección nueva con `zonaId` activa. Las fotos (hasta 5 imágenes) viajan como
        `multipart/form-data` en el campo `fotos`; Core las guarda en Storage bajo `{tenant}/{usuario}/`.
        Con una clave de idempotencia (HU-M05-09 / SCRUM-1405), el reintento con los mismos datos devuelve la
        solicitud existente con `200` en lugar de `201`. La clave llega en la cabecera `Idempotency-Key` o en el
        campo `claveIdempotencia`; si llegan las dos deben ser la misma (`422 MANI-SOL-422K`). Core guarda una
        huella de los datos y del contenido de las fotos: la misma clave con otros datos no es un reintento y
        responde `409 MANI-SOL-409K`, sin revelar la solicitud que ya tiene esa clave. La clave es por cliente y
        tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Clave UUID del intento de creación. Es la que el GatewayClient de Flutter usa para decidir si puede
            reintentar el POST. Equivale a `claveIdempotencia`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequestRequest'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateServiceRequestRequest'
                - type: object
                  properties:
                    fotos:
                      type: array
                      maxItems: 5
                      description: Imágenes PNG, JPEG o WEBP de hasta 5 MB cada una.
                      items:
                        type: string
                        format: binary
            encoding:
              fotos:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceRequestResponse'
        '200':
          description: Reintento con la misma clave y los mismos datos; devuelve la solicitud ya creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceRequestResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-SOL-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La cuenta no es un cliente activo del tenant del JWT (`MANI-SOL-403C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La clave de idempotencia ya se usó con otros datos (`MANI-SOL-409K`); no se crea ni se devuelve nada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Datos rechazados: categoría no disponible (`MANI-SOL-422C`), descripción fuera de 20 a 1000 caracteres
            (`MANI-SOL-422D`), sitio inexistente o dirección inválida (`MANI-SOL-422S`), zona no disponible
            (`MANI-SOL-422Z`), fotos inválidas (`MANI-SOL-422F`) o clave de idempotencia inválida o distinta entre la
            cabecera y el cuerpo (`MANI-SOL-422K`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /solicitudes/me:
    get:
      tags: [Service Requests]
      operationId: listOwnServiceRequests
      summary: El cliente consulta el estado y la zona declarada de sus solicitudes
      description: >
        HU-M07-04 (SCRUM-871, opción B): seguimiento simplificado, sin GPS en vivo ni ubicación del aliado
        (SRS §1.2). Devuelve las solicitudes del cliente de la sesión, de la más reciente a la más antigua
        (máximo 50), con su estado vigente, la zona que se declaró al publicarlas (`zonaDeclarada`, nunca la
        posición del aliado) y la fecha de la última actualización (`actualizadaEn`). El cliente y el tenant
        salen del JWT (`bearerAuth`); se ignora `X-Tenant-Id`. El estado se refresca al volver a consultar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Solicitudes del cliente de la sesión (lista vacía si no tiene)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestTrackingListResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-SOL-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La sesión no es de un cliente (`MANI-SOL-403C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /solicitudes/me/{id}:
    get:
      tags: [Service Requests]
      operationId: getOwnServiceRequest
      summary: El cliente consulta el estado y la zona declarada de una solicitud propia
      description: >
        HU-M07-04 (SCRUM-871). Mismo contenido que un elemento de `/solicitudes/me`. Una solicitud de otro
        cliente o de otro tenant responde `404`, igual que una inexistente, para no revelar que existe.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: id
          in: path
          required: true
          description: Id de la solicitud
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Solicitud del cliente de la sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceRequestTrackingResponse'
        '400':
          description: El id no es un UUID (`MANI-SOL-400`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-SOL-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La sesión no es de un cliente (`MANI-SOL-403C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La solicitud no existe o no es del cliente de la sesión (`MANI-SOL-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
