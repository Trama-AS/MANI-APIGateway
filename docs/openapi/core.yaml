  /solicitudes/{id}/mensajes:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la solicitud
        schema:
          type: string
          format: uuid
    post:
      tags: [Messaging]
      operationId: sendMessage
      summary: El cliente o el aliado asignado envía un mensaje en el hilo del servicio
      description: >
        HU-M09-02 (SCRUM-881, RF-20). Solo el cliente dueño de la solicitud y el aliado asignado. El remitente, el
        tenant y el rol salen del JWT, nunca del cuerpo. Se escribe mientras la solicitud está `ASIGNADA`,
        `COTIZANDO`, `ACEPTADA` o `EN_EJECUCION`; en cualquier otro estado el hilo solo se lee. Con
        `claveIdempotencia`, un reintento devuelve el mensaje ya guardado con `200` en lugar de `201`. El mensaje
        solo se da por enviado cuando ya está guardado: ante un fallo no hay entrega y la respuesta lleva
        `correlationId`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Mensaje guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse_'
        '200':
          description: Reintento con la misma `claveIdempotencia`; se devuelve el mensaje ya guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse_'
        '400':
          description: Contenido vacío, de más de 1000 caracteres o con caracteres no permitidos; id o clave que no son UUID (`MANI-MSG-400`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-MSG-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol no es cliente ni aliado (`MANI-MSG-403`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La solicitud no existe o la sesión no es su cliente ni su aliado asignado (`MANI-MSG-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La solicitud está en un estado que no admite mensajes nuevos (`MANI-MSG-409E`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Messaging]
      operationId: listMessages
      summary: Mensajes del hilo, con consulta incremental
      description: >
        HU-M09-02 (SCRUM-881, RF-20). Solo el cliente dueño y el aliado asignado. Sin `despuesDe` devuelve los últimos
        `limite` mensajes; con `despuesDe` (id del último mensaje que el cliente ya tiene) devuelve solo los
        posteriores. Siempre del más antiguo al más reciente. La app lo consulta cada pocos segundos mientras el chat
        está abierto; la respuesta no se cachea (`Cache-Control: no-store`). `mio` indica si el mensaje es de la sesión
        y `remitente.rol` el rol de quien lo escribió, sin datos personales.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: despuesDe
          in: query
          required: false
          description: Id del último mensaje que el cliente ya tiene; debe ser un mensaje de este hilo.
          schema:
            type: string
            format: uuid
        - name: limite
          in: query
          required: false
          description: Máximo de mensajes a devolver.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Los mensajes del hilo (lista vacía si no hay nuevos)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
        '400':
          description: El parámetro `limite` está fuera de 1 a 100, o `despuesDe`/id que no son UUID o no son un mensaje de este hilo (`MANI-MSG-400`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol no es cliente ni aliado (`MANI-MSG-403`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La solicitud no existe o la sesión no es su cliente ni su aliado asignado (`MANI-MSG-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

