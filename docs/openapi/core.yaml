openapi: 3.0.3
info:
  title: MANI-APIGateway — Identidad y Registro de Aliado (Core)
  description: >
    Contrato OpenAPI entre MANI-APIGateway y MANI-Node (Core) para el dominio
    de identidad: autenticación y registro de aliado persona natural. Vive en
    este repositorio (CFG-16) porque el Gateway es el límite público del
    contrato; MANI-Node lo implementa pero no lo posee.


    ## Propagación del claim de tenant

    MANI es multi-tenant: cada petición debe resolverse en el contexto de un
    tenant (organización) específico, y el Core nunca puede confiar en un
    valor de tenant que un cliente final pueda falsificar.

    1. **Pre-autenticación** (`POST /auth/login`, `POST /auth/register/ally`):
       el llamador todavía no tiene un JWT. Conforme a ADR-0018, el tenant se identifica
       con el header `X-Tenant-Slug` (slug público del tenant, ej. `trama-demo`),
       descartando el uso de IDs internos confiados por el backend para evitar spoofing.
       El Core responde `400 TENANT_NOT_FOUND` si el tenant no existe o está
       inactivo.
    2. **Emisión del claim**: si el login o el registro son exitosos, Supabase
       Auth emite un `accessToken` (JWT) cuyo payload incluye, bajo
       `app_metadata`, el claim `tenant_id` con el id del tenant resuelto en
       el paso anterior (ver `TokenClaims`; el Custom Access Token Hook de
       Supabase, CFG-12, es quien lo puebla). Ese mismo id se refleja en
       `ProfileSummary.tenantId` en la respuesta.
    3. **Post-autenticación** (`POST /auth/refresh`, `POST /auth/logout`, y
       en general cualquier endpoint protegido con `bearerAuth`): el tenant
       se deriva **exclusivamente** del claim dentro del JWT ya verificado.
       El Core ignora cualquier header `X-Tenant-Id` enviado en estas
       llamadas — aceptarlo permitiría a un cliente autenticado en el tenant
       A leer/escribir datos del tenant B con solo cambiar un header.

    Esta regla (tenant por header solo pre-auth; tenant por claim de JWT ya
    autenticado) es la que deben implementar tanto el Gateway como el Core.
  version: 0.14.0
servers:
  - url: https://api.mani.app/api/v1/core
    description: Producción, vía MANI-APIGateway
  - url: http://localhost/api/v1/core
    description: Gateway local (docker compose up -d gateway core-service)

tags:
  - name: Auth
    description: Autenticación e identidad de usuarios (Clientes, Aliados, Admins)
  - name: Ally Registration
    description: Registro de Aliados persona natural y empresa
  - name: Client Registration
    description: Registro de Clientes persona natural y empresa
  - name: Service Requests
    description: Creación de solicitudes de servicio por el cliente (US-04.1.1-M2 / SCRUM-1072)
  - name: Ally Availability
    description: Intervalos en los que el aliado está "No disponible" (US-02.1.6 / SCRUM-855)
  - name: Service Categories
    description: >
      Catálogo de categorías de servicio (US-03.1.1-M2 / SCRUM-1069). La
      gestión vive en Core, aislada por el tenant del JWT; la evaluación de
      reglas de la categoría es del Rules Service (`rules.yaml`).
  - name: Legal
    description: >
      Documentos legales y consentimiento de Habeas Data (US-02.3.2 /
      SCRUM-856, Ley 1581 de 2012).
  - name: Client Sites
    description: >
      Sedes del cliente empresa (US-02.2.2 / SCRUM-852, HU-M03-04 /
      SCRUM-1387, RF-08). Toda sede tiene dirección y zona del catálogo
      (RF-09). Solo las consultan y modifican el propio cliente empresa y el
      administrador de su tenant; el tenant, el usuario y el rol salen del JWT.

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: '[PENDIENTE] Inicia sesión y obtiene tokens de acceso'
      description: >
        [PENDIENTE DE IMPLEMENTACIÓN EN CORE NODE]
        Especificación del contrato para cuando Core implemente autenticación.
        Autentica un usuario (CLIENT, ALLY o ADMIN) dentro del tenant
        resuelto por `X-Tenant-Slug` (ADR-0018) y devuelve un `accessToken`/`refreshToken`
        con el claim `tenant_id` embebido.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas, sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: >
            Body inválido (`VALIDATION_ERROR`) o tenant inexistente/inactivo
            (`TENANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales incorrectas (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: '[PENDIENTE] Renueva el accessToken a partir de un refreshToken vigente'
      description: >
        [PENDIENTE DE IMPLEMENTACIÓN EN CORE NODE]
        Especificación del contrato para cuando Core implemente renovación de sesión.
        El tenant del nuevo accessToken se conserva del claim `tenant_id`
        del refreshToken original; este endpoint no acepta `X-Tenant-Slug` ni `X-Tenant-Id`.
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Body inválido (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: refreshToken inválido o expirado (`TOKEN_INVALID` / `TOKEN_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: '[PENDIENTE] Cierra la sesión actual e invalida el refreshToken asociado'
      description: >
        [PENDIENTE DE IMPLEMENTACIÓN EN CORE NODE]
        Especificación del contrato para cuando Core implemente cierre de sesión.
        El tenant se deriva del claim `tenant_id` del accessToken; no acepta `X-Tenant-Slug` ni `X-Tenant-Id`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '204':
          description: Sesión cerrada correctamente
        '401':
          description: accessToken ausente, inválido o expirado (`UNAUTHORIZED` / `TOKEN_INVALID` / `TOKEN_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/ally:
    post:
      tags: [Ally Registration]
      operationId: registerAllyNaturalPerson
      summary: Registra un nuevo Aliado persona natural
      description: >
        Crea el usuario y el perfil de Aliado (rol ALLY) en estado PENDING,
        a la espera de verificación KYC, dentro del tenant resuelto por
        `X-Tenant-Slug` (ADR-0018). Acepta `multipart/form-data` porque el registro
        incluye la subida de documentos KYC (cédula obligatoria, otros
        opcionales); el campo de cada archivo es su tipo de documento en
        minúsculas (p. ej. `cedula_ciudadania`). Devuelve tokens de sesión
        (con el claim `tenant_id` ya embebido) para que el Aliado pueda
        continuar el flujo de onboarding inmediatamente.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterAllyNaturalPersonRequest'
            encoding:
              cedula_ciudadania:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        '201':
          description: Aliado registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAllyResponse'
        '400':
          description: >
            Body inválido (`VALIDATION_ERROR`), términos y condiciones no
            aceptados (`TERMS_NOT_ACCEPTED`), tenant inexistente/inactivo
            (`TENANT_NOT_FOUND`) o categoría inexistente/inactiva
            (`CATEGORY_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Ya existe un usuario del tenant con ese email
            (`EMAIL_ALREADY_REGISTERED`) o, si se envió `documentNumber`, ya
            existe un aliado con ese número de documento
            (`DOCUMENT_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/ally/company:
    post:
      tags: [Ally Registration]
      operationId: registerAllyCompany
      summary: Registra un nuevo Aliado empresa (persona jurídica)
      description: >
        Crea el usuario y el perfil de Aliado empresa (rol ALLY) en estado PENDING,
        con sus documentos KYC (Cámara de Comercio obligatoria) y datos del representante
        legal, dentro del tenant resuelto por `X-Tenant-Slug` (ADR-0018 / US-02.1.2-M2).
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterAllyCompanyRequest'
            encoding:
              camara_comercio:
                contentType: application/pdf, image/png, image/jpeg
      responses:
        '201':
          description: Aliado empresa registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAllyResponse'
        '400':
          description: >
            Body inválido (`VALIDATION_ERROR`), tenant inexistente/inactivo
            (`TENANT_NOT_FOUND`) o categoría inexistente/inactiva
            (`CATEGORY_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Ya existe un usuario con ese email (`EMAIL_ALREADY_REGISTERED`)
            o la empresa ya está registrada con ese NIT en este tenant
            (`COMPANY_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/client:
    post:
      tags: [Client Registration]
      operationId: registerClient
      summary: Registra un nuevo Cliente persona natural
      description: >
        Crea el usuario y el perfil de Cliente (rol CLIENT), activo de inmediato porque no
        pasa por KYC, dentro del tenant resuelto por `X-Tenant-Slug` (ADR-0018 / US-02.2.1-M2).
        Si se envía `direccionHogar`, se crea el primer sitio del cliente.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
      responses:
        '201':
          description: Cliente registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAllyResponse'
        '400':
          description: Body inválido (`VALIDATION_ERROR`) o tenant inexistente/inactivo (`TENANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya existe un usuario con ese email en el tenant (`EMAIL_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/client/company:
    post:
      tags: [Client Registration]
      operationId: registerClientCompany
      summary: Registra un nuevo Cliente empresa (persona jurídica)
      description: >
        Crea la identidad y el perfil de Cliente empresa (rol CLIENT) con NIT y representante legal,
        activo de inmediato, y registra la aceptación de términos y condiciones, dentro del tenant
        resuelto por `X-Tenant-Slug` (ADR-0018 / HU-M02-07). No crea sitios: las sedes se
        administran después con `POST /clients/{id}/sites`.
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientCompanyRequest'
      responses:
        '201':
          description: Cliente empresa registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterClientCompanyResponse'
        '400':
          description: >
            Body inválido (`VALIDATION_ERROR`), términos sin aceptar (`TERMS_NOT_ACCEPTED`)
            o tenant inexistente/inactivo (`TENANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >
            Ya existe un usuario con ese email (`EMAIL_ALREADY_REGISTERED`) o la empresa ya está
            registrada con ese NIT en este tenant (`COMPANY_ALREADY_REGISTERED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /solicitudes:
    post:
      tags: [Service Requests]
      operationId: createServiceRequest
      summary: El cliente crea una solicitud de servicio
      description: >
        Crea la solicitud en estado `PENDIENTE` en Core (ARQ-03: Core crea la solicitud, Dispatch la orquesta
        después). Porta la función `crear_solicitud` al servicio (ADR-0022): el tenant y el cliente salen del
        JWT (`bearerAuth`), nunca del cuerpo ni de `X-Tenant-Id`. La ubicación es un sitio propio del cliente
        (`sitioId`) o una dirección nueva con `zonaId` activa. Las fotos (hasta 5 imágenes) viajan como
        `multipart/form-data` en el campo `fotos`; Core las guarda en Storage bajo `{tenant}/{usuario}/`.
        Con `claveIdempotencia` el reintento devuelve la solicitud existente con `200` en lugar de `201`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequestRequest'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CreateServiceRequestRequest'
                - type: object
                  properties:
                    fotos:
                      type: array
                      maxItems: 5
                      description: Imágenes PNG, JPEG o WEBP de hasta 5 MB cada una.
                      items:
                        type: string
                        format: binary
            encoding:
              fotos:
                contentType: image/png, image/jpeg, image/webp
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceRequestResponse'
        '200':
          description: Reintento con la misma `claveIdempotencia`; devuelve la solicitud ya creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceRequestResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-SOL-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La cuenta no es un cliente activo del tenant del JWT (`MANI-SOL-403C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Datos rechazados: categoría no disponible (`MANI-SOL-422C`), descripción fuera de 20 a 1000 caracteres
            (`MANI-SOL-422D`), sitio inexistente o dirección inválida (`MANI-SOL-422S`), zona no disponible
            (`MANI-SOL-422Z`), fotos inválidas (`MANI-SOL-422F`) o clave de idempotencia inválida (`MANI-SOL-422K`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /solicitudes/{id}/cotizaciones:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la solicitud
        schema:
          type: string
          format: uuid
    post:
      tags: [Service Requests]
      operationId: createQuote
      summary: El aliado asignado emite una cotización con mano de obra y materiales separados
      description: >
        US-04.2.1 (SCRUM-865, RF-15). Solo el aliado asignado a la solicitud cotiza, mientras la solicitud está
        en `ASIGNADA` o `COTIZANDO` y no tiene una cotización `PENDIENTE`. Core calcula el total y la versión, deja
        la cotización `PENDIENTE`, pasa la solicitud a `COTIZANDO` y registra el evento `COTIZACION_ENVIADA` en
        una sola transacción. Core es el dueño del estado del servicio tras la asignación (decisión 6A, SAD §7.4).
        El tenant y el aliado salen del JWT, nunca del cuerpo ni de `X-Tenant-Id`. La alerta contra el tarifario
        es de SCRUM-866 y no bloquea el envío.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: Cotización emitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Id de solicitud que no es UUID, importe faltante, negativo o con más de dos decimales, total en cero o `total` que no coincide (`MANI-COT-400`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-COT-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol no es aliado (`MANI-COT-403`) o el aliado no es el asignado a la solicitud (`MANI-COT-403A`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La solicitud no existe en el tenant del JWT (`MANI-COT-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El estado de la solicitud no admite cotización (`MANI-COT-409E`) o ya hay una cotización pendiente (`MANI-COT-409P`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Service Requests]
      operationId: listQuotes
      summary: El cliente dueño o el aliado asignado consultan las cotizaciones de la solicitud
      description: >
        US-04.2.1 (SCRUM-865). Devuelve todas las versiones, de la más reciente a la más antigua. Para cualquier
        otro usuario, del mismo tenant o de otro, la solicitud responde 404 igual que una inexistente, para no
        revelar que existe.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Cotizaciones de la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteListResponse'
        '400':
          description: Id de solicitud que no es UUID (`MANI-COT-400`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-COT-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol no es cliente ni aliado (`MANI-COT-403`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La solicitud no existe, no es del cliente o no está asignada al aliado (`MANI-COT-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /cotizaciones/{id}/aceptar:
    parameters:
      - name: id
        in: path
        required: true
        description: Id de la cotización
        schema:
          type: string
          format: uuid
    post:
      tags: [Service Requests]
      operationId: acceptQuote
      summary: El cliente acepta la cotización pendiente
      description: >
        US-04.2.3 (SCRUM-867, RF-17). La cotización pasa a `ACEPTADA` y la solicitud a `ACEPTADA`. El comentario es opcional. Solo responde el cliente dueño de la solicitud, sobre una cotización
        `PENDIENTE` de una solicitud en `COTIZANDO`. La transición, el evento en `evento_servicio` y la notificación
        `RESPUESTA_COTIZACION` al aliado (bandeja `/profiles/me/inbox`) van en una sola transacción; Core es el
        dueño del estado tras la asignación (decisión 6A, SAD §7.4). Tenant y cliente salen del JWT.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteAcceptRequest'
      responses:
        '200':
          description: Decisión registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDecisionResponse'
        '400':
          description: Id de cotización que no es UUID, o texto faltante, corto, de más de 500 caracteres o que no es cadena (`MANI-COT-400`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-COT-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol no es cliente (`MANI-COT-403`) o la cuenta no es un cliente activo del tenant (`MANI-COT-403C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La cotización no existe o no es de una solicitud del cliente (`MANI-COT-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La cotización ya fue respondida (`MANI-COT-409R`) o la solicitud no está en `COTIZANDO` (`MANI-COT-409E`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
