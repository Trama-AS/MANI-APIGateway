          description: Decisión registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDecisionResponse'
        '400':
          description: Id de cotización que no es UUID, o texto faltante, corto, de más de 500 caracteres o que no es cadena (`MANI-COT-400`)
          content:
