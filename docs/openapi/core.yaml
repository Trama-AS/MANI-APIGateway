  /pagos:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: El cliente paga una cotización aceptada en el sandbox simulado
      description: >
        HU-M11-01 (SCRUM-1432, RF-24). El cliente dueño de una cotización `ACEPTADA` la paga con el proveedor
        simulado. El monto es mano de obra + materiales de la cotización y nunca viene del cuerpo; tenant, cliente y
        rol salen del JWT. `escenario` elige el desenlace del mock (por omisión `APROBADO`). Una cotización no se cobra
        dos veces: con un pago aprobado, un nuevo intento responde `409`. Con `claveIdempotencia`, un reintento
        devuelve el pago ya registrado con `200` en lugar de `201`. Si el proveedor no da un desenlace (timeout,
        respuesta inválida) **no se registra ningún pago** y la respuesta es `504` o `502`. El cuerpo no admite datos
        de tarjeta.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Pago registrado (puede estar `APROBADO`, `RECHAZADO` o `PENDIENTE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '200':
          description: Reintento con la misma `claveIdempotencia`; se devuelve el pago ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Id o clave que no son UUID, o un campo de tarjeta en el cuerpo (`MANI-PAG-400`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-PAG-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: El rol no es cliente (`MANI-PAG-403`) o la cuenta no es un cliente activo del tenant (`MANI-PAG-403C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La cotización no existe o no es de una solicitud del cliente (`MANI-PAG-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La cotización no está aceptada (`MANI-PAG-409E`) o ya tiene un pago aprobado (`MANI-PAG-409A`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: El proveedor no dio una respuesta válida; no se realizó ningún cobro (`MANI-PAG-502`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: El proveedor no respondió a tiempo; no se realizó ningún cobro (`MANI-PAG-504`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

