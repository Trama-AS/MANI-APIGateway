      description: >
        US-04.3.1 (SCRUM-868, RF-18). La solicitud pasa a `EN_EJECUCION` desde `ACEPTADA` (cotización aceptada) o, si la categoría es `TARIFA_ESTANDAR`, desde `ASIGNADA`. Solo el aliado asignado. La hora la pone el servidor (la app no envía
        fechas); la transición, el evento en `evento_servicio` y el aviso al cliente (bandeja `/profiles/me/inbox`)
        van en una sola transacción. Core es el dueño del estado tras la asignación (decisión 6A, SAD §7.4).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
