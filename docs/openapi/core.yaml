          format: uuid
    post:
      tags: [Service Requests]
      operationId: createQuote
      summary: El aliado asignado emite una cotización con mano de obra y materiales separados
      description: >
        US-04.2.1 (SCRUM-865, RF-15). Solo el aliado asignado a la solicitud cotiza, mientras la solicitud está
        en `ASIGNADA` o `COTIZANDO` y no tiene una cotización `PENDIENTE`. Core calcula el total y la versión, deja
        la cotización `PENDIENTE`, pasa la solicitud a `COTIZANDO` y registra el evento `COTIZACION_ENVIADA` en
        una sola transacción. Core es el dueño del estado del servicio tras la asignación (decisión 6A, SAD §7.4).
