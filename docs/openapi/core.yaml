  /solicitudes/me/{id}/cancelar:
    patch:
      tags: [Service Requests]
      operationId: cancelOwnServiceRequest
      summary: El cliente cancela una solicitud propia antes de la ejecución
      description: >
        US-04.5.1 (SCRUM-877). Se cancela desde `PENDIENTE`, `ASIGNADA`, `COTIZANDO`, `ACEPTADA` o `RECHAZADA`;
        desde `EN_EJECUCION` o `FINALIZADA` responde `409`. El tenant y el cliente salen del JWT (`bearerAuth`),
        nunca del cuerpo ni de `X-Tenant-Id`; una solicitud de otro cliente o de otro tenant responde `404`, igual
        que una inexistente. La cancelación queda en la línea de tiempo (`SOLICITUD_CANCELADA`) y, si había aliado
        asignado, le llega una notificación `SOLICITUD_CANCELADA` a su bandeja. Repetirla es idempotente: responde
        `200` con `cancelada: false` y no repite el evento ni la notificación.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: id
          in: path
          required: true
          description: Id de la solicitud
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelServiceRequestRequest'
      responses:
        '200':
          description: Solicitud cancelada, o ya estaba cancelada (`cancelada` lo distingue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelServiceRequestResponse'
        '400':
          description: El id no es un UUID (`MANI-SOL-400`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sin token, token inválido o expirado (`UNAUTHORIZED`, `TOKEN_INVALID`, `TOKEN_EXPIRED`, `MANI-SOL-401`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: La sesión no es de un cliente (`MANI-SOL-403C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: La solicitud no existe o no es del cliente de la sesión (`MANI-SOL-404`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La solicitud ya está en ejecución o finalizada y no se puede cancelar (`MANI-SOL-409C`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: El motivo supera 200 caracteres (`MANI-SOL-422M`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La base de datos no está disponible; no hay respaldo (`SERVICE_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

