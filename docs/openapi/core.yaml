        in: path
        required: true
        description: Id de la ausencia. Una ausencia de otro aliado o de otro tenant responde 404.
        schema:
          type: string
          format: uuid
    patch:
      tags: [Ally Availability]
      operationId: updateAllyUnavailability
      summary: Edita una ausencia del aliado autenticado
      description: >
        Edición parcial: los campos que no se envían conservan su valor. Enviar
        `note: null` la borra. El intervalo resultante se valida igual que al crear.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllyAbsencePatch'
      responses:
        '200':
          description: Ausencia actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllyAbsenceResponse'
        '401':
          $ref: '#/components/responses/AbsenceUnauthorized'
        '403':
          $ref: '#/components/responses/AbsenceForbidden'
        '404':
          $ref: '#/components/responses/AbsenceNotFound'
        '409':
          $ref: '#/components/responses/AbsenceOverlap'
        '422':
          $ref: '#/components/responses/AbsenceInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Ally Availability]
      operationId: deleteAllyUnavailability
      summary: Elimina una ausencia; el aliado vuelve a estar disponible
      description: >
        Si la ausencia cubría el instante actual, el aliado vuelve a ser elegible
        para el despacho en cuanto se elimina.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '204':
          description: Ausencia eliminada
        '401':
          $ref: '#/components/responses/AbsenceUnauthorized'
        '403':
          $ref: '#/components/responses/AbsenceForbidden'
        '404':
          $ref: '#/components/responses/AbsenceNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /legal/documents/active:
    get:
      tags: [Legal]
      operationId: listActiveLegalDocuments
      summary: Documentos legales activos del tenant (pre-autenticación)
      description: >
        Ruta pública del Gateway (sin JWT): la app muestra los Términos y
        Condiciones y la Política de Tratamiento de Datos antes del registro,
        que es cuando el usuario debe aceptarlos. Conforme a ADR-0018 el
        tenant se identifica solo con `X-Tenant-Slug`; el Gateway descarta
        `Authorization` y cualquier `X-Tenant-Id` del cliente. Sin
        `X-Tenant-Slug` devuelve los documentos globales de la plataforma; con
        un slug que no existe responde `400 TENANT_NOT_FOUND`. Solo admite GET:
        el registro del consentimiento (`POST /legal/consents`) exige sesión.
      security: []
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Documentos legales activos del tenant, o los globales si no hay del tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentListResponse'
        '400':
          description: El slug no corresponde a un tenant (`TENANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog:
    get:
      tags: [Service Categories]
      operationId: listCatalogShowcase
      summary: Vitrina pública de categorías activas de un tenant (pre-autenticación)
      description: >
        Ruta pública del Gateway (sin JWT), usada por el registro antes de
        iniciar sesión. Conforme a ADR-0018 el tenant se identifica solo con
        `X-Tenant-Slug`; el Gateway descarta `Authorization` y cualquier
        `X-Tenant-Id` del cliente. Devuelve únicamente categorías `ACTIVO` de
        ese tenant, filtradas en la consulta. Sin `X-Tenant-Slug`, o con un
        slug que no existe, responde `200` con lista vacía: nunca expone
        categorías de otro tenant. Solo admite GET.
      security: []
      parameters:
        - $ref: '#/components/parameters/XTenantSlug'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Categorías activas del tenant (vacío sin slug o con slug inexistente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
              examples:
                conSlug:
                  summary: Con X-Tenant-Slug de un tenant existente
                  value:
                    categories:
                      - id: 60000000-0000-4000-8000-000000000011
                        name: Plomería
                        active: true
                        description: ''
                        tenantId: 10000000-0000-4000-8000-000000000011
                        flujoOperativo: COTIZACION_PREVIA
                sinSlug:
                  summary: Sin X-Tenant-Slug
                  value:
                    categories: []
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog/categories:
    get:
      tags: [Service Categories]
      operationId: listCategoriesForTenant
      summary: Lista las categorías del tenant autenticado (Backoffice)
      description: >
        El tenant se deriva exclusivamente del claim `app_metadata.tenant_id`
        del JWT, nunca de un header ni del cuerpo. Todos los endpoints de
        `/catalog/categories/*` exigen rol de administrador del tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: onlyActive
          in: query
          required: false
          description: true para excluir las categorías inactivas.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Categorías del tenant (incluye inactivas salvo `onlyActive=true`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '403':
          $ref: '#/components/responses/CategoryForbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Service Categories]
      operationId: createCategory
      summary: Crea una categoría de servicio en el tenant autenticado
      description: >
        `name` se normaliza (espacios extremos y repetidos) y debe tener entre
        3 y 60 caracteres con al menos una letra; es único por tenant sin
        distinguir mayúsculas (`ux_categoria_tenant_nombre`). `flujoOperativo`
        es obligatorio y sin valor por omisión. La categoría nace `ACTIVO`.
        Las reglas de nombre y flujo pasan al Rules Service con US-03.1.1-M6
        (SCRUM-1226), que actualiza este contrato.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '403':
          $ref: '#/components/responses/CategoryForbidden'
        '409':
          $ref: '#/components/responses/CategoryNameConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Service Categories]
      operationId: getCategory
      summary: Obtiene una categoría del tenant autenticado
      description: Una categoría de otro tenant responde 404, sin distinguir «no existe» de «no es tuya».
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Categoría encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '403':
          $ref: '#/components/responses/CategoryForbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Service Categories]
      operationId: updateCategory
      summary: Actualiza nombre, descripción o flujo operativo de una categoría
      description: >
        Actualización parcial: requiere al menos uno de `name`, `description`
        o `flujoOperativo`, y solo valida los campos enviados. Una categoría
        histórica que no cumple las reglas actuales puede editarse sin
        cambiar su nombre.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/CategoryValidationError'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '403':
          $ref: '#/components/responses/CategoryForbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '409':
          $ref: '#/components/responses/CategoryNameConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog/categories/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [Service Categories]
      operationId: activateCategory
      summary: Activa una categoría del tenant autenticado
      description: Cambia el estado a `ACTIVO`; no borra ni altera las relaciones existentes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      # Mismas respuestas que /deactivate (ancla YAML: OpenAPI 3.0 no permite
      # $ref sobre el mapa completo de responses).
      responses: &categoryStatusResponses
        '200':
          description: Categoría con su estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/CategoryUnauthorized'
        '403':
          $ref: '#/components/responses/CategoryForbidden'
        '404':
          $ref: '#/components/responses/CategoryNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog/categories/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [Service Categories]
      operationId: deactivateCategory
      summary: Desactiva una categoría del tenant autenticado
      description: >
        Cambia el estado a `INACTIVO` sin borrado físico: la categoría deja de
        aparecer en `GET /catalog`, conserva sus relaciones en
        `aliado_categoria` y no afecta servicios en curso (US-03.1.2).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses: *categoryStatusResponses

  /clients/{id}/sites:
    parameters:
      - $ref: '#/components/parameters/ClientId'
    get:
      tags: [Client Sites]
      operationId: listClientSites
      summary: Lista las sedes del cliente empresa
      description: >
        Devuelve todas las sedes del cliente, de la más antigua a la más
        reciente. Un cliente de otro tenant responde 404 sin datos; otro
        cliente del mismo tenant, 403.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Sedes del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSiteListResponse'
        '401':
          $ref: '#/components/responses/SiteUnauthorized'
        '403':
          $ref: '#/components/responses/SiteForbidden'
        '404':
          $ref: '#/components/responses/ClientNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Client Sites]
      operationId: addClientSite
      summary: Agrega una sede al cliente empresa
      description: >
        Crea la sede con dirección y zona obligatorias (RF-09). Las reglas de
        acceso pueden enviarse aquí o configurarse después.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientSiteRequest'
      responses:
        '201':
          description: Sede creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSiteResponse'
        '400':
          $ref: '#/components/responses/SiteValidationError'
        '401':
          $ref: '#/components/responses/SiteUnauthorized'
        '403':
          $ref: '#/components/responses/SiteForbidden'
        '404':
          $ref: '#/components/responses/ClientNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/{id}/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/SiteId'
    patch:
      tags: [Client Sites]
      operationId: updateClientSite
      summary: Edita una sede del cliente empresa
      description: >
        Edición parcial: solo cambian los campos enviados. La sede debe seguir
        con dirección y zona (RF-09); si el resultado no cumple, responde 400
        y no se modifica nada. Las reglas de la sede no se editan aquí. La sede
        debe ser de ese cliente y de ese tenant: si no, 404 sin datos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientSiteRequest'
      responses:
        '200':
          description: Sede con los datos actualizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSiteResponse'
        '400':
          $ref: '#/components/responses/SiteValidationError'
        '401':
          $ref: '#/components/responses/SiteUnauthorized'
        '403':
          $ref: '#/components/responses/SiteForbidden'
        '404':
          $ref: '#/components/responses/SiteNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog/zones:
    get:
      tags: [Geographic Zones]
      operationId: listZoneCatalog
      summary: Catálogo jerárquico de zonas geográficas (HU-M04-04)
      description: >
        Devuelve el catálogo geográfico como lista plana (`zones`) y como árbol
        anidado por `parentId` (`tree`). La tabla `zona` es un catálogo global
        compartido por todos los tenants (no tiene columna `tenant_id`), así
        que la respuesta es la misma para cualquier tenant: no hay zona privada
        de una organización. Aun así exige JWT, porque es la única forma de no
        depender de un tenant o un rol enviados por el cliente; el Core toma
        ambos del claim `app_metadata` y descarta `X-Tenant-Id` y
        `X-Tenant-Slug` en esta ruta. Los niveles previstos, de mayor a menor
        granularidad, son `CIUDAD`, `LOCALIDAD` y `BARRIO`. Las zonas
        desactivadas se devuelven con `selectable: false` salvo que se pida
        `onlyActive=true`: una zona inactiva sigue siendo consultable porque un
        sitio histórico puede apuntar a ella, pero nunca se ofrece para
        escoger. Una fila que no puede colocarse en el árbol (sin zona padre,
        con padre inexistente o con relación de nivel invertida) no se cuelga
        en un lugar inventado: queda fuera de `zones` y `tree`, y se reporta en
        `inconsistencies`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: onlyActive
          in: query
          required: false
          description: Con `true` deja fuera las zonas desactivadas.
          schema:
            type: boolean
            default: false
        - name: level
          in: query
          required: false
          description: >
            Recorta al nivel indicado. Un valor fuera de la lista es un error
            de contrato (`400 MANI-ZON-400`), no un listado vacío.
          schema:
            type: string
            enum: [CIUDAD, LOCALIDAD, BARRIO]
        - name: parentId
          in: query
          required: false
          description: >
            Recorta a los descendientes de esa zona. Un id que no existe
            responde `404 MANI-ZON-404`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Catálogo geográfico del nivel y recorte pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneCatalogResponse'
              examples:
                jerarquiaCompleta:
                  summary: Árbol completo con solo las zonas activas
                  value:
                    zones:
                      - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12
                        name: Bogotá D.C.
                        level: CIUDAD
                        parentId: null
                        active: true
                        selectable: true
                      - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a13
                        name: Chapinero
                        level: LOCALIDAD
                        parentId: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12
                        active: true
                        selectable: true
                      - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a15
                        name: Chicó Norte
                        level: BARRIO
                        parentId: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a13
                        active: true
                        selectable: true
                    tree:
                      - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12
                        name: Bogotá D.C.
                        level: CIUDAD
                        parentId: null
                        active: true
                        selectable: true
                        children:
                          - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a13
                            name: Chapinero
                            level: LOCALIDAD
                            parentId: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12
                            active: true
                            selectable: true
                            children:
                              - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a15
                                name: Chicó Norte
                                level: BARRIO
                                parentId: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a13
                                active: true
                                selectable: true
                                children: []
                    inconsistencies: []
                conZonaInconsistente:
                  summary: Una fila sin zona padre queda fuera del árbol y se reporta
                  value:
                    zones: []
                    tree: []
                    inconsistencies:
                      - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a15
                        level: BARRIO
                        parentId: null
                        reason: ZONA_SIN_PADRE
        '400':
          $ref: '#/components/responses/ZoneBadRequest'
        '401':
          $ref: '#/components/responses/ZoneUnauthorized'
        '404':
          $ref: '#/components/responses/ZoneNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /catalog/zones/{id}:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    get:
      tags: [Geographic Zones]
      operationId: getZone
      summary: Una zona con su camino a la raíz y sus hijos directos
      description: >
        Devuelve la zona, sus `ancestors` ordenados de la raíz hacia ella y sus
        `children` directos. Responde también para una zona desactivada, con
        `selectable: false`: ocultarla rompería la consulta de un sitio
        histórico que la referencia. Un `id` que no es UUID responde
        `400 MANI-ZON-400` sin consultar la base; un UUID desconocido responde
        `404 MANI-ZON-404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Zona con su jerarquía inmediata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneDetailResponse'
              examples:
                localidadConBarrio:
                  summary: Localidad con su ciudad padre y un barrio hijo
                  value:
                    zone:
                      id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a13
                      name: Chapinero
                      level: LOCALIDAD
                      parentId: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12
                      active: true
                      selectable: true
                    ancestors:
                      - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12
                        name: Bogotá D.C.
                        level: CIUDAD
                        parentId: null
                        active: true
                        selectable: true
                    children:
                      - id: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a15
                        name: Chicó Norte
                        level: BARRIO
                        parentId: b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a13
                        active: true
                        selectable: true
        '400':
          $ref: '#/components/responses/ZoneBadRequest'
        '401':
          $ref: '#/components/responses/ZoneUnauthorized'
        '404':
          $ref: '#/components/responses/ZoneNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        El Core verifica la firma y extrae userId (`sub`) y, de
        `app_metadata`, `tenant_id` y `user_role`. Ver `TokenClaims`.

  parameters:
    XTenantSlug:
      name: X-Tenant-Slug
      in: header
      required: true
      description: >
        Slug público del tenant (ADR-0018). Usado en endpoints pre-autenticación
        para resolver la organización sin confiar en IDs internos.
      schema:
        type: string
        example: plomeria-express
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: >
        Id de trazabilidad distribuida propagado desde el Gateway. Si no se
        envía, el Core genera uno (`node-<timestamp>`) y lo devuelve en el
        header de respuesta y en el body de error.
      schema:
        type: string

    CategoryId:
      name: id
      in: path
      required: true
      description: Identificador de la categoría de servicio.
      schema:
        type: string
    ClientId:
      name: id
      in: path
      required: true
      description: >
        Identificador del cliente empresa, o `me` para el cliente empresa del
        usuario de la sesión (Core lo resuelve con el usuario y el tenant del
        JWT). Con `me`, un usuario sin cliente empresa en el tenant recibe 404.
      schema:
        type: string
    SiteId:
      name: siteId
      in: path
      required: true
      description: Identificador de la sede.
      schema:
        type: string

    ZoneId:
      name: id
      in: path
      required: true
      description: Identificador estable de la zona geográfica.
      schema:
        type: string
        format: uuid

  responses:
    SiteValidationError:
      description: >
        Petición inválida (`VALIDATION_ERROR`): dirección de menos de 5
        caracteres, zona ausente o que no existe en el catálogo, nombre vacío,
        un campo que no es texto, un campo no editable o un PATCH sin campos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SiteUnauthorized:
      description: >
        Sin JWT válido. Lo responde el Gateway (`UNAUTHORIZED`) antes de llegar
        a Core; si el token no trae tenant, Core responde 401.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SiteForbidden:
      description: >
        El rol no es cliente ni administrador del tenant, o es otro cliente
        del mismo tenant (`FORBIDDEN`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientNotFound:
      description: El cliente no existe o es de otro tenant (`CLIENT_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SiteNotFound:
      description: >
        El cliente no existe o es de otro tenant (`CLIENT_NOT_FOUND`), o la
        sede no existe o no es de ese cliente (`SITE_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Error interno del servicio (`INTERNAL_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    AbsenceUnauthorized:
      description: >
        Falta el header Authorization (`UNAUTHORIZED`), el JWT es inválido o
        expiró (`TOKEN_INVALID` / `TOKEN_EXPIRED`), o la sesión no trae usuario y
        tenant (`MANI-AUS-401`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbsenceErrorResponse'
    AbsenceForbidden:
      description: El usuario no es un aliado del tenant del JWT (`MANI-AUS-403`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbsenceErrorResponse'
    AbsenceNotFound:
      description: La ausencia no existe para este aliado y tenant (`MANI-AUS-404`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbsenceErrorResponse'
    AbsenceOverlap:
      description: El intervalo se cruza con otra ausencia del aliado (`MANI-AUS-409`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbsenceErrorResponse'
    AbsenceInvalid:
      description: >
        Horario inválido (`MANI-AUS-422H`: fin no posterior al inicio, más de 365
        días o ausencia ya terminada) o datos inválidos (`MANI-AUS-422V`: fecha sin
        zona horaria, motivo fuera del catálogo o nota de más de 280 caracteres)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AbsenceErrorResponse'
    CategoryValidationError:
      description: >
        Petición inválida (`VALIDATION_ERROR`): falta `name` o no cumple 3-60
        caracteres con una letra, `flujoOperativo` ausente o fuera de
        `COTIZACION_PREVIA` | `TARIFA_ESTANDAR`, `description` no es texto, o un
        PUT sin ningún campo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryUnauthorized:
      description: >
        Sin JWT válido. Lo responde el Gateway (`UNAUTHORIZED`) antes de
        llegar a Core; si la sesión no trae rol, Core responde 401.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryForbidden:
      description: >
        El rol de la sesión no es administrador del tenant (`FORBIDDEN`). Se
        acepta `ADMIN` o `ADMIN_TENANT` (`admin_tenant` en el claim).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryNotFound:
      description: La categoría no existe o es de otro tenant (`CATEGORY_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CategoryNameConflict:
      description: Ya existe una categoría con ese nombre en el tenant (`CATEGORY_NAME_ALREADY_EXISTS`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ZoneBadRequest:
      description: >
        Nivel fuera de la jerarquía prevista, o identificador que no es UUID
        (`MANI-ZON-400`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'MANI-ZON-400: nivel debe ser uno de CIUDAD, LOCALIDAD, BARRIO'
            code: MANI-ZON-400
            correlationId: node-1793067016518

    ZoneUnauthorized:
      description: >
        Falta el `Authorization: Bearer`, o el token está vencido o no verifica.
        El catálogo es global, pero la ruta sigue cerrada: es lo que impide
        depender de un tenant o un rol enviados por el cliente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ZoneNotFound:
      description: La zona, o la zona padre indicada, no existe (`MANI-ZON-404`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'MANI-ZON-404: la zona no existe'
            code: MANI-ZON-404
            correlationId: node-1793067016518

  schemas:
    ErrorCode:
      type: string
      description: Catálogo cerrado de códigos de error del dominio de identidad.
      enum:
        - VALIDATION_ERROR
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - TENANT_NOT_FOUND
        - CATEGORY_NOT_FOUND
        - CATEGORY_NAME_ALREADY_EXISTS
        - CLIENT_NOT_FOUND
        - SITE_NOT_FOUND
        - FORBIDDEN
        - EMAIL_ALREADY_REGISTERED
        - DOCUMENT_ALREADY_REGISTERED
        - COMPANY_ALREADY_REGISTERED
        - TERMS_NOT_ACCEPTED
        - SERVICE_UNAVAILABLE
        - MANI-SOL-400
        - MANI-SOL-401
        - MANI-SOL-403C
        - MANI-SOL-404
        - MANI-SOL-409C
        - MANI-SOL-409K
        - MANI-SOL-422C
        - MANI-SOL-422D
        - MANI-SOL-422S
        - MANI-SOL-422Z
        - MANI-SOL-422F
        - MANI-SOL-422K
        - MANI-SOL-422M
        - MANI-COT-400
        - MANI-COT-401
        - MANI-COT-403
        - MANI-COT-403A
        - MANI-COT-404
        - MANI-COT-409E
        - MANI-COT-409P
        - MANI-COT-403C
        - MANI-COT-409R
        - MANI-EJE-400
        - MANI-EJE-401
        - MANI-EJE-403
        - MANI-EJE-403A
        - MANI-EJE-404
        - MANI-EJE-409E
        - MANI-EJE-409I
        - MANI-EJE-409F
        - MANI-EJE-409N
        - MANI-EVT-400
        - MANI-EVT-401
        - MANI-EVT-403
        - MANI-EVT-403A
        - MANI-EVT-404
        - MANI-EVT-409E
        - MANI-MSG-400
        - MANI-MSG-401
        - MANI-MSG-403
        - MANI-MSG-404
        - MANI-MSG-409E
        - MANI-EVT-404E
        - MANI-ZON-400
        - MANI-ZON-404
        - INTERNAL_ERROR
      x-code-meanings:
        VALIDATION_ERROR: 'HTTP 400 — el body no cumple el esquema (campo faltante/formato inválido).'
        INVALID_CREDENTIALS: 'HTTP 401 — email y/o password no coinciden con ningún usuario del tenant.'
        UNAUTHORIZED: 'HTTP 401 — falta el header Authorization en un endpoint protegido.'
        TOKEN_INVALID: 'HTTP 401 — el JWT no tiene un formato o firma válidos.'
        TOKEN_EXPIRED: 'HTTP 401 — el JWT es válido pero ya expiró.'
        TENANT_NOT_FOUND: 'HTTP 400 — X-Tenant-Id no corresponde a un tenant existente/activo.'
        CATEGORY_NOT_FOUND: 'HTTP 400 en registro de aliado (categoriaId inexistente o inactiva); HTTP 404 en /catalog/categories/{id} (no existe o es de otro tenant).'
        CATEGORY_NAME_ALREADY_EXISTS: 'HTTP 409 — ya existe una categoría con ese nombre en el tenant (sin distinguir mayúsculas ni espacios extremos).'
        CLIENT_NOT_FOUND: 'HTTP 404 — el cliente empresa no existe o es de otro tenant.'
        SITE_NOT_FOUND: 'HTTP 404 — la sede no existe o no es de ese cliente.'
        FORBIDDEN: 'HTTP 403 — el rol de la sesión no puede invocar el endpoint (p. ej. /catalog/categories exige administrador del tenant).'
        EMAIL_ALREADY_REGISTERED: 'HTTP 409 — ya existe un usuario con ese email en el tenant.'
        DOCUMENT_ALREADY_REGISTERED: 'HTTP 409 — se envió documentNumber y ya existe un Aliado con ese número en el tenant.'
        COMPANY_ALREADY_REGISTERED: 'HTTP 409 — la empresa ya está registrada con ese NIT en el tenant (registro de aliado empresa).'
        TERMS_NOT_ACCEPTED: 'HTTP 400 — el registro de aliado persona natural llegó sin acceptsTerms=true (SCRUM-856).'
        SERVICE_UNAVAILABLE: 'HTTP 503 — una dependencia (p. ej. la base de datos) no está disponible; no hay respaldo local.'
        MANI-SOL-400: 'HTTP 400 — el id de la solicitud no es un UUID (seguimiento del cliente).'
        MANI-SOL-401: 'HTTP 401 — sesión requerida para crear, consultar o cancelar solicitudes.'
        MANI-SOL-403C: 'HTTP 403 — solo un cliente activo del tenant puede publicar, consultar o cancelar sus solicitudes.'
        MANI-SOL-404: 'HTTP 404 — la solicitud no existe o no es del cliente de la sesión.'
        MANI-SOL-422C: 'HTTP 422 — la categoría no existe, no está activa o es de otro tenant.'
        MANI-SOL-422D: 'HTTP 422 — la descripción debe tener entre 20 y 1000 caracteres.'
        MANI-SOL-422S: 'HTTP 422 — el sitio no es del cliente o la dirección no tiene entre 5 y 200 caracteres.'
        MANI-SOL-422Z: 'HTTP 422 — la zona no existe o no está activa.'
        MANI-SOL-422F: 'HTTP 422 — más de 5 fotos o un archivo que no es imagen.'
        MANI-SOL-422K: 'HTTP 422 — la clave de idempotencia no es un UUID, o la cabecera Idempotency-Key y claveIdempotencia no coinciden.'
        MANI-SOL-409C: 'HTTP 409 — la solicitud ya está en ejecución o finalizada y no se puede cancelar.'
        MANI-SOL-409K: 'HTTP 409 — la clave de idempotencia ya se usó para crear una solicitud con otros datos.'
        MANI-SOL-422M: 'HTTP 422 — el motivo de la cancelación supera 200 caracteres.'
        MANI-COT-400: 'HTTP 400 — id de solicitud no válido o importes de la cotización inválidos.'
        MANI-COT-401: 'HTTP 401 — sesión requerida para cotizar o consultar cotizaciones.'
        MANI-COT-403: 'HTTP 403 — el rol de la sesión no puede emitir o consultar cotizaciones.'
        MANI-COT-403A: 'HTTP 403 — solo el aliado asignado a la solicitud puede cotizarla.'
        MANI-COT-404: 'HTTP 404 — la solicitud no existe o no es visible para la sesión.'
        MANI-COT-409E: 'HTTP 409 — el estado de la solicitud no admite cotización.'
        MANI-COT-409P: 'HTTP 409 — la solicitud ya tiene una cotización pendiente de respuesta del cliente.'
        MANI-COT-403C: 'HTTP 403 — solo un cliente activo del tenant responde cotizaciones.'
        MANI-COT-409R: 'HTTP 409 — la cotización ya fue respondida; una segunda respuesta no produce otra transición.'
        MANI-EJE-400: 'HTTP 400 — id de solicitud u observación inválidos.'
        MANI-EJE-401: 'HTTP 401 — sesión requerida para marcar o consultar la ejecución.'
        MANI-EJE-403: 'HTTP 403 — el rol de la sesión no puede marcar o consultar la ejecución.'
        MANI-EJE-403A: 'HTTP 403 — solo el aliado asignado marca el inicio y el fin del servicio.'
        MANI-EJE-404: 'HTTP 404 — la solicitud no existe o no es visible para la sesión.'
        MANI-EJE-409E: 'HTTP 409 — la solicitud no puede iniciarse en su estado (necesita la cotización aceptada).'
        MANI-EJE-409I: 'HTTP 409 — la ejecución ya fue iniciada.'
        MANI-EJE-409F: 'HTTP 409 — el servicio ya fue finalizado.'
        MANI-EJE-409N: 'HTTP 409 — no se puede finalizar un servicio que no ha iniciado.'
        MANI-EVT-400: 'HTTP 400 — tipo, observación, evidencia, clave de idempotencia o id inválidos.'
        MANI-EVT-401: 'HTTP 401 — sesión requerida para registrar o consultar eventos.'
        MANI-EVT-403: 'HTTP 403 — el rol de la sesión no puede registrar o consultar eventos.'
        MANI-EVT-403A: 'HTTP 403 — solo el aliado asignado registra eventos del servicio.'
        MANI-EVT-404: 'HTTP 404 — la solicitud no existe o no es visible para la sesión.'
        MANI-EVT-409E: 'HTTP 409 — solo se registran eventos con la solicitud en ejecución.'
        MANI-EVT-404E: 'HTTP 404 — el evento no existe en la solicitud o no tiene evidencia.'
        MANI-ZON-400: 'HTTP 400 — nivel geográfico fuera de la jerarquía, o identificador de zona que no es UUID.'
        MANI-ZON-404: 'HTTP 404 — la zona, o la zona padre indicada, no existe.'
        MANI-MSG-400: 'HTTP 400 — contenido, clave de idempotencia, límite, cursor o id inválidos.'
        MANI-MSG-401: 'HTTP 401 — sesión requerida para la mensajería.'
        MANI-MSG-403: 'HTTP 403 — solo el cliente y el aliado del servicio participan en la mensajería.'
        MANI-MSG-404: 'HTTP 404 — la solicitud no existe o la sesión no es su cliente ni su aliado asignado.'
        MANI-MSG-409E: 'HTTP 409 — la solicitud en su estado actual no admite mensajes nuevos.'
        INTERNAL_ERROR: 'HTTP 500 — fallo no controlado del servicio.'

    ErrorResponse:
      type: object
      description: Formato estándar de error de todo el Core (ver MANI-Node/src/middlewares/errorHandler.middleware.js).
      properties:
        error:
          type: string
          description: Mensaje legible, seguro para mostrar al usuario final.
          example: Credenciales inválidas
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
          example: node-1791318617328
      required: [error, correlationId]

    TokenClaims:
      type: object
      description: >
        Forma del payload del JWT emitido por Supabase Auth al llamar
        `/auth/login` y `/auth/register/ally`. No es un objeto que viaje
        serializado en un response body — documenta el contenido de
        `AuthTokens.accessToken` una vez decodificado. `tenant_id`/`user_role`
        los puebla el Custom Access Token Hook (CFG-12) leyendo la fila de
        `public.usuario`; por eso están anidados en `app_metadata`, no en la
        raíz del token, y `user_role` llega en español minúscula
        ('aliado' | 'cliente' | 'admin_tenant').
      properties:
        sub:
          type: string
          description: userId del usuario autenticado (= auth.users.id = usuario.id).
        app_metadata:
          type: object
          properties:
            tenant_id:
              type: string
              description: Id del tenant al que pertenece el usuario. Propagado en cada request subsecuente.
            user_role:
              type: string
              enum: [aliado, cliente, admin_tenant]
          required: [tenant_id, user_role]
        iat:
          type: integer
          description: Unix timestamp de emisión.
        exp:
          type: integer
          description: Unix timestamp de expiración.
      required: [sub, app_metadata, iat, exp]

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT de corta duración emitido por Supabase Auth. Payload descrito en `TokenClaims`.
        refreshToken:
          type: string
          description: >
            Token opaco de larga duración. Lo renueva el cliente contra
            Supabase Auth, que es el emisor (ADR-0031); Core solo lo recibe
            en `/auth/logout`.
        expiresIn:
          type: integer
          description: Segundos hasta la expiración del accessToken
          example: 3600
      required: [accessToken, refreshToken, expiresIn]

    ProfileSummary:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
          description: Refleja el claim app_metadata.tenant_id del JWT emitido para este perfil.
          example: trama-demo
        role:
          type: string
          enum: [CLIENT, ALLY, ADMIN]
        fullName:
          type: string
        status:
          type: string
          enum: [VERIFIED, PENDING, REJECTED]
      required: [id, tenantId, role, fullName, status]

    RegisterAllyNaturalPersonRequest:
      type: object
      description: >
        Datos de registro para un Aliado persona natural. El tenant se toma
        del header `X-Tenant-Slug` (ADR-0018), no del body. documentType/documentNumber
        son opcionales (el formulario actual de Flutter no los recolecta
        todavía; cuando los envíe, se validan y se usan para la verificación
        de duplicados).
      properties:
        fullName:
          type: string
          example: María Fernanda Rojas
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        phone:
          type: string
          example: '+573001234567'
        categoriaId:
          type: string
          description: Id de categoria_servicio (debe existir y estar ACTIVO en el tenant).
        documentType:
          type: string
          enum: [CC, CE, PASSPORT]
          description: Tipo de documento de identidad (persona natural). Opcional.
        documentNumber:
          type: string
          example: '1020304050'
          description: Opcional; si se envía, se valida unicidad por tenant.
        cedula_ciudadania:
          type: string
          format: binary
          description: Documento KYC obligatorio (cédula). Al menos un archivo es requerido.
        rut_certificado:
          type: string
          format: binary
          description: Documento KYC opcional (RUT/certificado).
        acceptsTerms:
          type: boolean
          description: >
            Aceptación expresa de los Términos y Condiciones y de la Política de
            Datos Personales (SCRUM-856, Ley 1581). Debe llegar en `true`; si
            falta o llega con otro valor, Core responde 400 `TERMS_NOT_ACCEPTED`
            y no crea ningún registro. Al aceptar, Core guarda el consentimiento
            con versión, usuario y fecha.
          example: true
      required:
        - fullName
        - email
        - password
        - categoriaId
        - cedula_ciudadania
        - acceptsTerms

    RegisterAllyResponse:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/ProfileSummary'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
      required: [profile, tokens]

    RegisterClientRequest:
      type: object
      description: Datos de registro para un Cliente persona natural.
      properties:
        fullName:
          type: string
          example: Carlos Andres Gomez
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        phone:
          type: string
          example: '+573001234567'
        direccionHogar:
          type: string
          description: Dirección del primer sitio del cliente (opcional).
      required: [fullName, email, password]

    RegisterClientCompanyRequest:
      type: object
      description: Datos de registro para un Cliente persona jurídica (empresa), sin sitios.
      properties:
        razonSocial:
          type: string
          example: Constructora Andina SAS
        nit:
          type: string
          description: >
            9 o 10 dígitos con dígito de verificación opcional tras guion. Se aceptan puntos y
            espacios; Core los quita antes de guardar.
          example: 900.123.456-7
        nombreRepresentante:
          type: string
          example: Laura Gomez
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        phone:
          type: string
          example: '+576011234567'
        acceptsTerms:
          type: boolean
          description: Debe ser `true`; Core registra el consentimiento en la misma operación.
      required: [razonSocial, nit, nombreRepresentante, email, password, acceptsTerms]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    PasswordRecoveryRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: ana@correo.co
      required: [email]

    PasswordResetRequest:
      type: object
      properties:
        accessToken:
          type: string
          description: Token que trae el enlace del correo de recuperación.
        newPassword:
          type: string
          format: password
          minLength: 8
      required: [accessToken, newPassword]

    RegisterClientCompanyResponse:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/ProfileSummary'
        company:
          type: object
          properties:
            clienteId:
              type: string
            tipo:
              type: string
              enum: [PERSONA_JURIDICA]
            razonSocial:
              type: string
            nit:
              type: string
              description: NIT normalizado, sin puntos ni espacios.
              example: 900123456-7
            nombreRepresentante:
              type: string
          required: [clienteId, tipo, razonSocial, nit, nombreRepresentante]
        tokens:
          $ref: '#/components/schemas/AuthTokens'
      required: [profile, company, tokens]

    RegisterAllyCompanyRequest:
      type: object
      description: Datos de registro para un Aliado persona jurídica (empresa).
      properties:
        razonSocial:
          type: string
          example: Soluciones Industriales SAS
        nit:
          type: string
          example: 900123456-1
        nombreRepresentante:
          type: string
          example: Carlos Gomez
        docRepresentante:
          type: string
          example: '1020304050'
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        phone:
          type: string
          example: '+573001234567'
        categoriaId:
          type: string
          description: Id de categoria_servicio opcional.
        camara_comercio:
          type: string
          format: binary
          description: Documento KYC obligatorio (Cámara de Comercio).
        rut_empresa:
          type: string
          format: binary
          description: Documento KYC opcional (RUT).
        cedula_representante:
          type: string
          format: binary
          description: Documento KYC opcional (Cédula representante legal).
      required:
        - razonSocial
        - nit
        - nombreRepresentante
        - email
        - password
        - camara_comercio

    CreateServiceRequestRequest:
      type: object
      description: Debe venir `sitioId` o la pareja `direccion` + `zonaId`.
      required: [categoriaId, descripcion]
      properties:
        categoriaId:
          type: string
          format: uuid
          description: Categoría ACTIVO del tenant del JWT.
        descripcion:
          type: string
          minLength: 20
          maxLength: 1000
        sitioId:
          type: string
          format: uuid
          description: Sitio existente del cliente. Si viene, se ignoran `direccion` y `zonaId`.
        direccion:
          type: string
          minLength: 5
          maxLength: 200
          description: Dirección nueva (crea un sitio del cliente).
        zonaId:
          type: string
          format: uuid
          description: Zona activa de la dirección nueva.
        claveIdempotencia:
          type: string
          format: uuid
          description: Clave del cliente para reintentos seguros. Equivale a la cabecera `Idempotency-Key`.

    ServiceRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, example: PENDIENTE }
        categoriaId: { type: string, format: uuid }
        categoria: { type: string, example: Plomería }
        flujoOperativo: { type: string, nullable: true, example: COTIZACION_PREVIA }
        descripcion: { type: string }
        sitioId: { type: string, format: uuid }
        direccion: { type: string }
        zonaId: { type: string, format: uuid }
        zona: { type: string, example: Chapinero }
        zonaPadre: { type: string, nullable: true, example: Bogotá }
        fotos: { type: integer, description: Cantidad de fotos registradas }
        createdAt: { type: string, format: date-time }
      required: [id, estado, categoriaId, descripcion, sitioId, zonaId, createdAt]

    CreateServiceRequestResponse:
      type: object
      properties:
        solicitud:
          $ref: '#/components/schemas/ServiceRequest'
        correlationId:
          type: string
      required: [solicitud, correlationId]

    ServiceRequestTracking:
      type: object
      description: >
        Seguimiento de una solicitud para su cliente (SCRUM-871). `zonaDeclarada` es la zona que se declaró al
        publicar la solicitud, no la ubicación del aliado; `actualizadaEn` dice de cuándo es el estado.
      properties:
        id: { type: string, format: uuid }
        estado: { type: string, example: ASIGNADA }
        categoria: { type: string, example: Plomería }
        zonaDeclarada:
          type: object
          properties:
            nombre: { type: string, example: Chapinero }
            nivel: { type: string, example: LOCALIDAD }
            zonaPadre: { type: string, nullable: true, example: Bogotá }
          required: [nombre, nivel]
        creadaEn: { type: string, format: date-time }
        actualizadaEn: { type: string, format: date-time }
      required: [id, estado, categoria, zonaDeclarada, creadaEn, actualizadaEn]

    ServiceRequestTrackingListResponse:
      type: object
      properties:
        solicitudes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ServiceRequestTracking'
        correlationId:
          type: string
      required: [solicitudes, correlationId]

    ServiceRequestTrackingResponse:
      type: object
      properties:
        solicitud:
          $ref: '#/components/schemas/ServiceRequestTracking'
        correlationId:
          type: string
      required: [solicitud, correlationId]

    CancelServiceRequestRequest:
      type: object
      description: Cuerpo opcional de la cancelación (SCRUM-877). Cualquier otro campo, como un tenant, se ignora.
      properties:
        motivo:
          type: string
          maxLength: 200
          example: Ya resolví el problema por mi cuenta
          description: Queda en la línea de tiempo del servicio. Sin motivo se registra uno por defecto.

    CancelServiceRequestResponse:
      type: object
      properties:
        solicitud:
          $ref: '#/components/schemas/ServiceRequestTracking'
        cancelada:
          type: boolean
          description: '`true` si esta petición la canceló; `false` si ya estaba cancelada.'
        correlationId:
          type: string
      required: [solicitud, cancelada, correlationId]

    AbsenceErrorResponse:
      type: object
      description: >
        Error de los endpoints de disponibilidad. Mismo formato que
        `ErrorResponse`, con el catálogo de códigos propio del dominio.
      properties:
        error:
          type: string
          example: 'MANI-AUS-409: el intervalo se cruza con otra ausencia registrada'
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - TOKEN_INVALID
            - TOKEN_EXPIRED
            - MANI-AUS-401
            - MANI-AUS-403
            - MANI-AUS-404
            - MANI-AUS-409
            - MANI-AUS-422H
            - MANI-AUS-422V
            - INTERNAL_ERROR
        correlationId:
          type: string
          example: node-1791318617328
      required: [error, correlationId]

    AllyAbsenceReason:
      type: string
      enum: [VACACIONES, ENFERMEDAD, OTRO]

    AllyAbsenceRequest:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
          description: Inicio de la ausencia, ISO-8601 con zona horaria obligatoria.
          example: '2026-10-20T08:00:00-05:00'
        endsAt:
          type: string
          format: date-time
          description: Fin (exclusivo). Posterior a startsAt, en el futuro y a máximo 365 días del inicio.
          example: '2026-10-25T18:00:00-05:00'
        reason:
          $ref: '#/components/schemas/AllyAbsenceReason'
        note:
          type: string
          nullable: true
          maxLength: 280
          example: Vacaciones familiares
      required: [startsAt, endsAt, reason]

    AllyAbsencePatch:
      type: object
      minProperties: 1
      properties:
        startsAt:
          type: string
          format: date-time
          example: '2026-10-20T08:00:00-05:00'
        endsAt:
          type: string
          format: date-time
          example: '2026-10-26T18:00:00-05:00'
        reason:
          $ref: '#/components/schemas/AllyAbsenceReason'
        note:
          type: string
          nullable: true
          maxLength: 280

    AllyAbsence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          example: '2026-10-20T13:00:00.000Z'
        endsAt:
          type: string
          format: date-time
          example: '2026-10-25T23:00:00.000Z'
        reason:
          $ref: '#/components/schemas/AllyAbsenceReason'
        note:
          type: string
          nullable: true
        active:
          type: boolean
          description: true si la ausencia cubre el instante actual (el aliado está "No disponible" ahora).
      required: [id, startsAt, endsAt, reason, note, active]

    AllyAbsenceResponse:
      type: object
      properties:
        message:
          type: string
        correlationId:
          type: string
        data:
          $ref: '#/components/schemas/AllyAbsence'
      required: [data, correlationId]

    AllyAbsenceListResponse:
      type: object
      properties:
        message:
          type: string
        correlationId:
          type: string
        availableNow:
          type: boolean
          description: false si alguna ausencia cubre el instante actual.
        data:
          type: array
          items:
            $ref: '#/components/schemas/AllyAbsence'
      required: [availableNow, data, correlationId]

    ServiceCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: Nombre normalizado (sin espacios extremos ni repetidos).
        active:
          type: boolean
        description:
          type: string
          description: Vacío si no se registró (la tabla actual no tiene la columna).
        tenantId:
          type: string
          nullable: true
          description: null solo en fixtures de desarrollo.
        flujoOperativo:
          type: string
          nullable: true
          enum: [COTIZACION_PREVIA, TARIFA_ESTANDAR, null]
          description: null en filas históricas anteriores a US-03.1.1-M2 (seed QA).
        createdAt:
          type: string
          format: date-time
          description: >
            Solo en las respuestas de administración (`/catalog/categories/*`).
            No aparece en la vitrina pública `GET /catalog`.
        alliesCount:
          type: integer
          minimum: 0
          description: >
            Aliados que declaran la categoría (US-03.1.2: el administrador ve a
            quién afecta antes de desactivarla; desactivar no los desvincula ni
            corta los servicios en curso). Solo en las respuestas de
            administración; no aparece en la vitrina pública `GET /catalog`.
      required: [id, name, active, description, tenantId, flujoOperativo]

    CategoryResponse:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/ServiceCategory'
      required: [category]

    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCategory'
      required: [categories]

    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60
          example: Plomería Residencial
        description:
          type: string
          maxLength: 500
        flujoOperativo:
          type: string
          enum: [COTIZACION_PREVIA, TARIFA_ESTANDAR]
      required: [name, flujoOperativo]

    UpdateCategoryRequest:
      type: object
      description: Al menos uno de los tres campos.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 60
        description:
          type: string
          maxLength: 500
        flujoOperativo:
          type: string
          enum: [COTIZACION_PREVIA, TARIFA_ESTANDAR]

    LegalDocument:
      type: object
      description: Documento legal vigente (SCRUM-856). `tenantId` es null en los documentos globales de la plataforma.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
          nullable: true
        tipo:
          type: string
          enum: [TERMS_AND_CONDITIONS, PRIVACY_POLICY, CUSTOM]
        version:
          type: string
          example: '1.0'
        contenido:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          nullable: true
      required: [id, tipo, version, contenido, isActive]

    LegalDocumentListResponse:
      type: object
      properties:
        correlationId:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocument'
      required: [data]

    ClientSite:
      type: object
      properties:
        id:
          type: string
        clienteId:
          type: string
          description: Solo en las respuestas de alta y edición.
        nombre:
          type: string
          description: Si no se envió al crearla, es la dirección.
        direccion:
          type: string
        zonaId:
          type: string
        contactoNombre:
          type: string
          nullable: true
        contactoTelefono:
          type: string
          nullable: true
        reglas:
          type: object
          nullable: true
          additionalProperties: true
          description: Reglas de acceso de la sede; se configuran en `PATCH /sites/{id}/rules`.
      required: [id, nombre, direccion, zonaId]

    ClientSiteResponse:
      type: object
      properties:
        message:
          type: string
        correlationId:
          type: string
        sitio:
          $ref: '#/components/schemas/ClientSite'
      required: [correlationId, sitio]

    ClientSiteListResponse:
      type: object
      properties:
        correlationId:
          type: string
        clienteId:
          type: string
        razonSocial:
          type: string
        totalSitios:
          type: integer
          minimum: 0
        sitios:
          type: array
          items:
            $ref: '#/components/schemas/ClientSite'
      required: [clienteId, totalSitios, sitios]

    CreateClientSiteRequest:
      type: object
      properties:
        nombre:
          type: string
        direccion:
          type: string
          minLength: 5
        zonaId:
          type: string
          minLength: 1
          description: Zona del catálogo (RF-09).
        contactoNombre:
          type: string
        contactoTelefono:
          type: string
        reglas:
          type: object
          additionalProperties: true
      required: [direccion, zonaId]

    UpdateClientSiteRequest:
      type: object
      description: Al menos uno de los campos. Cualquier otro campo, incluido `reglas`, responde 400.
      minProperties: 1
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
        direccion:
          type: string
          minLength: 5
        zonaId:
          type: string
          minLength: 1
        contactoNombre:
          type: string
          nullable: true
          description: null borra el contacto.
        contactoTelefono:
          type: string
          nullable: true
          description: null borra el contacto.

    CreateQuoteRequest:
      type: object
      description: >
        Importes no negativos con máximo dos decimales (DECIMAL(12,2)); se rechazan en lugar de redondearse. El total
        de los dos renglones debe ser mayor que cero. Tenant, aliado y versión no se envían: los fija Core.
      properties:
        valorManoObra:
          description: Valor de la mano de obra.
          oneOf:
            - type: number
              minimum: 0
              maximum: 9999999999.99
            - type: string
              pattern: '^\d{1,10}(\.\d{1,2})?$'
        valorMateriales:
          description: Valor de los materiales; puede ser 0.
          oneOf:
            - type: number
              minimum: 0
              maximum: 9999999999.99
            - type: string
              pattern: '^\d{1,10}(\.\d{1,2})?$'
        total:
          type: number
          description: Opcional. Si se envía, debe coincidir con la suma; Core calcula el total de todos modos.
      required: [valorManoObra, valorMateriales]

    Quote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Consecutivo por solicitud que asigna Core.
        estado:
          type: string
          enum: [PENDIENTE, ACEPTADA, RECHAZADA, AJUSTE_SOLICITADO, EXPIRADA]
          description: PENDIENTE al emitirse; las demás transiciones son de SCRUM-867.
        valorManoObra:
          type: number
        valorMateriales:
          type: number
        total:
          type: number
          description: Suma de mano de obra y materiales calculada por Core.
        creadaEn:
          type: string
          format: date-time
      required: [id, solicitudId, version, estado, valorManoObra, valorMateriales, total, creadaEn]

    QuoteResponse:
      type: object
      properties:
        cotizacion:
          $ref: '#/components/schemas/Quote'
        correlationId:
          type: string
      required: [cotizacion, correlationId]

    QuoteListResponse:
      type: object
      properties:
        cotizaciones:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
        correlationId:
          type: string
      required: [cotizaciones, correlationId]

    QuoteAcceptRequest:
      type: object
      properties:
        comentario:
          type: string
          minLength: 0
          maxLength: 500
          description: Opcional.

    QuoteRejectRequest:
      type: object
      description: Debe venir `motivo` o, en su defecto, `comentario`.
      properties:
        motivo:
          type: string
          minLength: 5
          maxLength: 500
          description: Motivo del rechazo.
        comentario:
          type: string
          minLength: 5
          maxLength: 500
          description: Se usa como motivo si no viene `motivo`.

    QuoteAdjustRequest:
      type: object
      properties:
        comentario:
          type: string
          minLength: 3
          maxLength: 500
          description: Qué debe cambiar el aliado en la siguiente versión.
      required: [comentario]

    CreatePaymentRequest:
      type: object
      description: >
        Solicitud de pago en el sandbox. No admite datos de tarjeta ni monto: el monto sale de la cotización.
      properties:
        cotizacionId:
          type: string
          format: uuid
          description: Cotización `ACEPTADA` del cliente.
        escenario:
          type: string
          enum: [APROBADO, RECHAZADO, PENDIENTE, TIMEOUT, RESPUESTA_INVALIDA]
          default: APROBADO
          description: Desenlace que simula el proveedor. `TIMEOUT` y `RESPUESTA_INVALIDA` no registran ningún pago.
        claveIdempotencia:
          type: string
          format: uuid
          description: Un reintento con la misma clave devuelve el pago ya registrado.
      required: [cotizacionId]

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cotizacionId:
          type: string
          format: uuid
        monto:
          type: number
          example: 150000.5
        moneda:
          type: string
          example: COP
        estado:
          type: string
          enum: [APROBADO, RECHAZADO, PENDIENTE]
        proveedor:
          type: string
          example: mock
        simulado:
          type: boolean
          description: "`true` si el proveedor no mueve dinero real (todos los pagos del Sprint 5)."
        referenciaProveedor:
          type: string
        motivo:
          type: string
          nullable: true
          description: Motivo del rechazo, si lo hubo.
        correlationId:
          type: string
          nullable: true
        creadoEn:
          type: string
          format: date-time
      required: [id, cotizacionId, monto, moneda, estado, proveedor, simulado, referenciaProveedor, creadoEn]

    PaymentResponse:
      type: object
      properties:
        pago:
          $ref: '#/components/schemas/Payment'
        correlationId:
          type: string
      required: [pago]

    PaymentReceipt:
      type: object
      properties:
        numero:
          type: string
          example: SIM-55555555
        simulado:
          type: boolean
        leyenda:
          type: string
          nullable: true
          description: Aviso de que el comprobante es de prueba; viene cuando `simulado` es `true`.
        pagoId:
          type: string
          format: uuid
        cotizacionId:
          type: string
          format: uuid
        monto:
          type: number
        moneda:
          type: string
        estado:
          type: string
          enum: [APROBADO]
        proveedor:
          type: string
        referenciaProveedor:
          type: string
        fecha:
          type: string
          format: date-time
      required: [numero, simulado, pagoId, cotizacionId, monto, moneda, estado, proveedor, referenciaProveedor, fecha]

    PaymentReceiptResponse:
      type: object
      properties:
        comprobante:
          $ref: '#/components/schemas/PaymentReceipt'
        correlationId:
          type: string
      required: [comprobante]

    SendMessageRequest:
      type: object
      description: Mensaje del servicio. El remitente no viene en el cuerpo, sale del JWT.
      properties:
        contenido:
          type: string
          minLength: 1
          maxLength: 1000
          description: Texto del mensaje; se recortan los espacios de los extremos y no puede quedar vacío.
        claveIdempotencia:
          type: string
          format: uuid
          description: Un reintento con la misma clave devuelve el mensaje ya guardado.
      required: [contenido]

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          format: uuid
        contenido:
          type: string
        creadoEn:
          type: string
          format: date-time
        remitente:
          type: object
          properties:
            rol:
              type: string
              enum: [CLIENT, ALLY]
          required: [rol]
        mio:
          type: boolean
          description: Verdadero si el mensaje lo escribió la sesión que consulta.
      required: [id, solicitudId, contenido, creadoEn, remitente, mio]

    MessageResponse_:
      type: object
      properties:
        mensaje:
          $ref: '#/components/schemas/Message'
        correlationId:
          type: string
      required: [mensaje]

    MessageListResponse:
      type: object
      properties:
        mensajes:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        correlationId:
          type: string
      required: [mensajes]

    QuoteDecisionResponse:
      type: object
      properties:
        cotizacion:
          $ref: '#/components/schemas/Quote'
        solicitud:
          type: object
          properties:
            id:
              type: string
              format: uuid
            estado:
              type: string
              enum: [ACEPTADA, RECHAZADA, COTIZANDO]
          required: [id, estado]
        correlationId:
          type: string
      required: [cotizacion, solicitud, correlationId]

    ExecutionMarkRequest:
      type: object
      properties:
        observacion:
          type: string
          maxLength: 500
          description: Opcional. La hora no se envía; la pone el servidor.

    ExecutionMarkResponse:
      type: object
      properties:
        solicitud:
          type: object
          properties:
            id:
              type: string
              format: uuid
            estado:
              type: string
              enum: [EN_EJECUCION, FINALIZADA]
          required: [id, estado]
        evento:
          type: object
          properties:
            tipo:
              type: string
              enum: [INICIO_EJECUCION, FIN_EJECUCION]
            registradoEn:
              type: string
              format: date-time
              description: Hora del servidor.
          required: [tipo, registradoEn]
        correlationId:
          type: string
      required: [solicitud, evento, correlationId]

    ExecutionMark:
      type: object
      nullable: true
      properties:
        registradoEn:
          type: string
          format: date-time
        observacion:
          type: string
          nullable: true
      required: [registradoEn, observacion]

    ExecutionResponse:
      type: object
      properties:
        ejecucion:
          type: object
          properties:
            solicitudId:
              type: string
              format: uuid
            estado:
              type: string
            inicio:
              $ref: '#/components/schemas/ExecutionMark'
            fin:
              $ref: '#/components/schemas/ExecutionMark'
          required: [solicitudId, estado, inicio, fin]
        correlationId:
          type: string
      required: [ejecucion, correlationId]

    ServiceEventRequest:
      type: object
      properties:
        tipo:
          type: string
          enum: [AVANCE, NOVEDAD, OBSERVACION]
          default: OBSERVACION
        observacion:
          type: string
          minLength: 3
          maxLength: 2000
        claveIdempotencia:
          type: string
          format: uuid
      required: [observacion]

    ServiceEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipo:
          type: string
          description: >
            Los que registra el aliado son EJECUCION_AVANCE, EJECUCION_NOVEDAD y EJECUCION_OBSERVACION; el resto
            los registra Core (SOLICITUD_CREADA, COTIZACION_ENVIADA, COTIZACION_ACEPTADA, INICIO_EJECUCION...).
        descripcion:
          type: string
          nullable: true
        registradoEn:
          type: string
          format: date-time
          description: Hora del servidor.
        autor:
          type: object
          properties:
            id:
              type: string
              format: uuid
            rol:
              type: string
          required: [id, rol]
        tieneEvidencia:
          type: boolean
      required: [id, tipo, descripcion, registradoEn, autor, tieneEvidencia]

    ServiceEventResponse:
      type: object
      properties:
        evento:
          $ref: '#/components/schemas/ServiceEvent'
        correlationId:
          type: string
      required: [evento, correlationId]

    ServiceEventListResponse:
      type: object
      properties:
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEvent'
        correlationId:
          type: string
      required: [eventos, correlationId]

    ServiceEventEvidenceResponse:
      type: object
      properties:
        evidencia:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: URL firmada; vence en `expiraEnSegundos`.
            expiraEnSegundos:
              type: integer
              example: 300
          required: [url, expiraEnSegundos]
        correlationId:
          type: string
      required: [evidencia, correlationId]


    Zone:
      type: object
      description: >
        Nodo del catálogo geográfico. No lleva `tenantId`: la tabla `zona` es
        un catálogo global y no tiene esa columna.
      properties:
        id:
          type: string
          format: uuid
          description: Identificador estable, el mismo que referencian `sitio` y `cobertura_aliado`.
        name:
          type: string
          example: Chapinero
        level:
          type: string
          enum: [CIUDAD, LOCALIDAD, BARRIO]
          description: >
            Nivel en la jerarquía, de mayor a menor granularidad. Una fila
            histórica puede traer otro valor: se devuelve tal cual y no se
            usa para validar relaciones.
        parentId:
          type: string
          format: uuid
          nullable: true
          description: Zona padre. Solo `CIUDAD` puede tenerlo en `null`.
        active:
          type: boolean
          description: Estado `ACTIVO`/`ACTIVA` en la base.
        selectable:
          type: boolean
          description: >
            Si la zona puede escogerse. Una zona inactiva se devuelve con
            `false` para que la interfaz no la ofrezca (criterio C2).
      required: [id, name, level, parentId, active, selectable]

    ZoneTreeNode:
      allOf:
        - $ref: '#/components/schemas/Zone'
        - type: object
          properties:
            children:
              type: array
              description: >
                Hijos directos, anidados recursivamente. Vacío en el nivel más
                fino, o cuando un recorte por `level` o `onlyActive` deja los
                hijos fuera del resultado.
              items:
                $ref: '#/components/schemas/ZoneTreeNode'
          required: [children]

    ZoneInconsistency:
      type: object
      description: >
        Fila del catálogo que no puede colocarse en el árbol. Se reporta en
        lugar de colgarla en un lugar inventado o de descartarla en silencio.
      properties:
        id:
          type: string
          format: uuid
        level:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          enum:
            - ZONA_SIN_PADRE
            - PADRE_INEXISTENTE
            - PADRE_ES_LA_MISMA_ZONA
            - RELACION_DE_NIVEL_INVERTIDA
      required: [id, level, parentId, reason]

    ZoneCatalogResponse:
      type: object
      properties:
        zones:
          type: array
          description: Lista plana de las zonas del recorte pedido, sin las inconsistentes.
          items:
            $ref: '#/components/schemas/Zone'
        tree:
          type: array
          description: Las mismas zonas anidadas por `parentId`.
          items:
            $ref: '#/components/schemas/ZoneTreeNode'
        inconsistencies:
          type: array
          items:
            $ref: '#/components/schemas/ZoneInconsistency'
      required: [zones, tree, inconsistencies]

    ZoneDetailResponse:
      type: object
      properties:
        zone:
          $ref: '#/components/schemas/Zone'
        ancestors:
          type: array
          description: Camino desde la raíz hasta la zona, sin incluirla.
          items:
            $ref: '#/components/schemas/Zone'
        children:
          type: array
          description: Hijos directos de la zona.
          items:
            $ref: '#/components/schemas/Zone'
      required: [zone, ancestors, children]

    RequestCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        flujoOperativo:
          type: string
          enum: [COTIZACION_PREVIA, TARIFA_ESTANDAR]
      required: [id, nombre, flujoOperativo]

    RequestCategoryListResponse:
      type: object
      properties:
        categorias:
          type: array
          items:
            $ref: '#/components/schemas/RequestCategory'
        correlationId:
          type: string
      required: [categorias, correlationId]

    RequestSite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          description: Nombre de la sede; si no tiene, la dirección.
        direccion:
          type: string
        zonaId:
          type: string
          format: uuid
        zona:
          type: string
        zonaPadre:
          type: string
          nullable: true
      required: [id, nombre, direccion, zonaId, zona, zonaPadre]

    RequestSiteListResponse:
      type: object
      properties:
        sitios:
          type: array
          items:
            $ref: '#/components/schemas/RequestSite'
        correlationId:
          type: string
      required: [sitios, correlationId]
