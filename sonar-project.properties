# =====================================================================
# Configuración de SonarQube para MANI-APIGateway
# Referencia: ADR-0005 (SAST en CI/CD con SonarQube)
# Servidor: SonarQube Community de la VM de Calidad (self-hosted, no SonarCloud)
# =====================================================================

# Identificación del proyecto. En pull requests el workflow quality-gate.yml
# sobrescribe la clave con mani-apigateway-pr (Community no analiza ramas ni PRs).
sonar.projectKey=mani-apigateway
sonar.projectName=MANI-APIGateway

sonar.sourceEncoding=UTF-8

# El Gateway es NGINX; el análisis cubre Dockerfile, docker-compose, YAML (contratos
# OpenAPI), JSON, scripts JS de herramientas y detección de secretos en todos los
# archivos (seeds SQL, scripts y ambientes de Postman incluidos).
sonar.sources=.

# Colecciones de Postman generadas desde el contrato (scripts/generate-*.js) y la de
# regresión de QA (qa/newman/generar_coleccion.js): se analiza el generador, no su salida.
sonar.exclusions=\
  .github/**,\
  node_modules/**,\
  ssl/**,\
  postman/MANI-Core.postman_collection.json,\
  postman/MANI-Rules.postman_collection.json,\
  qa/newman/*.postman_collection.json,\
  qa/playwright/package-lock.json

# Sin pruebas unitarias: el repositorio solo tiene herramientas de contrato y la
# configuración del proxy, validadas por los gates de ci.yml (OpenAPI, Newman).
sonar.coverage.exclusions=**/*
