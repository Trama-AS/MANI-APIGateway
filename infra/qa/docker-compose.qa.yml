services:
  gateway:
    image: ghcr.io/trama-as/mani-apigateway:staging
    container_name: mani-api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M
    networks:
      - mani-network
    depends_on:
      - core-service
      - rules-service
      - dispatch-service

  core-service:
    image: ghcr.io/trama-as/mani-node:staging
    container_name: mani-core-service
    hostname: core-service
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: qa
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      DATABASE_URL: ${DATABASE_URL}
      GATEWAY_URL: http://gateway:80
      RULES_SERVICE_URL: http://rules-service:8080
      DISPATCH_SERVICE_URL: http://dispatch-service:5000
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - mani-network

  rules-service:
    image: ghcr.io/trama-as/mani-java:staging
    container_name: mani-rules-service
    hostname: rules-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: staging
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - mani-network

  dispatch-service:
    image: ghcr.io/trama-as/mani-dotnet:staging
    container_name: mani-dispatch-service
    hostname: dispatch-service
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Staging
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      CORE_SERVICE_URL: http://core-service:3000
      RULES_SERVICE_URL: http://rules-service:8080
      ConnectionStrings__DefaultConnection: ${DISPATCH_DB_CONNECTION}
    expose:
      - "5000"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - mani-network

  flutter-web:
    image: ghcr.io/trama-as/mani-flutter:staging
    container_name: mani-flutter-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      API_GATEWAY_URL: http://10.43.100.141:8080
      TENANT_SLUG: acme-servicios
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - mani-network

  landing-web:
    image: ghcr.io/trama-as/mani-landing:staging
    container_name: mani-landing-web
    restart: unless-stopped
    ports:
      - "3001:80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - mani-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: mani-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 384M
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - mani-network

networks:
  mani-network:
    driver: bridge
    name: mani-network

volumes:
  kafka-data:
    driver: local
