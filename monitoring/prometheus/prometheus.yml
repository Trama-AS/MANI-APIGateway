global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/auth-alerts.yml
scrape_configs:
  - job_name: mani_core_qa
    metrics_path: /metrics
    static_configs:
      - targets: ['10.43.100.141:80']
        labels: { ambiente: qa }
  - job_name: mani_salud_qa
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://10.43.100.141/health
          - http://10.43.100.141/api/v1/core/health
          - http://10.43.100.141/api/v1/dispatch/health
          - http://10.43.100.141/api/v1/rules/health
          - http://10.43.100.141:8080/
        labels: { ambiente: qa }
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: 'blackbox:9115' }
