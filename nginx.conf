worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout  65;

    # Logging con correlation ID para trazabilidad distribuida
    log_format json_analytics escape=json '{'
        '"time_local": "$time_local",'
        '"remote_addr": "$remote_addr",'
        '"request_method": "$request_method",'
        '"request_uri": "$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent": "$body_bytes_sent",'
        '"request_time": "$request_time",'
        '"http_referrer": "$http_referer",'
        '"http_user_agent": "$http_user_agent",'
        '"x_correlation_id": "$http_x_correlation_id"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    # Upstreams de los microservicios
    upstream core_service {
        server core-service:3000;
        keepalive 32;
    }

    upstream rules_service {
        server rules-service:8080;
        keepalive 32;
    }

    upstream dispatch_service {
        server dispatch-service:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Generación o propagación de Correlation ID
        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = '') {
            set $correlation_id $request_id;
        }

        # Configuración de CORS transversal
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Correlation-ID, X-Tenant-ID' always;
        add_header 'X-Correlation-ID' $correlation_id always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Healthcheck del Gateway
        location /health {
            return 200 '{"status":"UP","gateway":"MANI-APIGateway","timestamp":"$time_iso8601"}';
        }

        # 1. Rutas Core (Node.js): Usuarios, Tenants, Perfiles, KYC, Catálogos
        location /api/v1/core/ {
            proxy_pass http://core_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # 2. Rutas Rules (Java): Motor de reglas, Tarifas, Ranking de aliados
        location /api/v1/rules/ {
            proxy_pass http://rules_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # 3. Rutas Dispatch (.NET): Emparejamiento, Despacho, Exclusión Concurrente
        location /api/v1/dispatch/ {
            proxy_pass http://dispatch_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }
    }
}
