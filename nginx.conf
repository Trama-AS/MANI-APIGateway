worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout  65;

    # Logging con correlation ID para trazabilidad distribuida
    log_format json_analytics escape=json '{'
        '"time_local": "$time_local",'
        '"remote_addr": "$remote_addr",'
        '"request_method": "$request_method",'
        '"request_uri": "$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent": "$body_bytes_sent",'
        '"request_time": "$request_time",'
        '"http_referrer": "$http_referer",'
        '"http_user_agent": "$http_user_agent",'
        '"x_correlation_id": "$http_x_correlation_id"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    # Upstreams de los microservicios
    upstream core_service {
        server core-service:3000;
        keepalive 32;
    }

    upstream rules_service {
        server rules-service:8080;
        keepalive 32;
    }

    upstream dispatch_service {
        server dispatch-service:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Generación o propagación de Correlation ID
        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = '') {
            set $correlation_id $request_id;
        }

        # Configuración de CORS transversal
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Correlation-ID, X-Correlation-Id, X-Tenant-ID, X-Tenant-Slug' always;
        add_header 'X-Correlation-ID' $correlation_id always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Manejadores de error centralizados para autenticación en el Gateway
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;

        location @unauthorized {
            default_type application/json;
            return 401 '{"error":"UNAUTHORIZED","message":"Peticion rechazada en el Gateway: token invalido, expirado o sin claim de tenant_id","correlationId":"$correlation_id"}';
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"error":"FORBIDDEN","message":"Peticion rechazada en el Gateway: acceso denegado para el tenant o rol","correlationId":"$correlation_id"}';
        }

        # Healthcheck del Gateway
        location /health {
            return 200 '{"status":"UP","gateway":"MANI-APIGateway","timestamp":"$time_iso8601"}';
        }

        # Subrequest interno para validar autenticación y claims de tenant contra Core (CFG-22)
        location = /_auth_validate {
            internal;
            proxy_pass http://core_service/api/v1/auth/validate-token;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # -------------------------------------------------------------
        # Rutas Públicas (No requieren JWT previo)
        # -------------------------------------------------------------
        # Endpoints de autenticación y registro (pre-auth)
        location /api/v1/core/auth/ {
            proxy_pass http://core_service/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            # ADR-0018: Pre-auth solo se acepta X-Tenant-Slug; descartar cualquier X-Tenant-Id externo
            proxy_set_header X-Tenant-Id "";
            proxy_set_header X-Tenant-Slug $http_x_tenant_slug;
        }

        location = /api/v1/core/health {
            proxy_pass http://core_service/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location = /api/v1/rules/health {
            proxy_pass http://rules_service/api/v1/rules/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        location = /api/v1/dispatch/health {
            proxy_pass http://dispatch_service/api/v1/dispatch/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # -------------------------------------------------------------
        # Rutas Protegidas (CFG-22: Validación estricta en el Gateway)
        # -------------------------------------------------------------
        # 1. Rutas Core (Node.js): Usuarios, Tenants, Perfiles, KYC, Catálogos
        location /api/v1/core/ {
            auth_request /_auth_validate;
            auth_request_set $auth_tenant_id $upstream_http_x_tenant_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_id $upstream_http_x_user_id;

            proxy_pass http://core_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;

            # Inyección de claims validados y confiables hacia el backend
            proxy_set_header X-Tenant-Id $auth_tenant_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header Authorization $http_authorization;
        }

        # 2. Rutas Rules (Java): Motor de reglas, Tarifas, Ranking de aliados
        location /api/v1/rules/ {
            auth_request /_auth_validate;
            auth_request_set $auth_tenant_id $upstream_http_x_tenant_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_id $upstream_http_x_user_id;

            proxy_pass http://rules_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;

            proxy_set_header X-Tenant-Id $auth_tenant_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header Authorization $http_authorization;
        }

        # 3. Rutas Dispatch (.NET): Emparejamiento, Despacho, Exclusión Concurrente
        location /api/v1/dispatch/ {
            auth_request /_auth_validate;
            auth_request_set $auth_tenant_id $upstream_http_x_tenant_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_id $upstream_http_x_user_id;

            proxy_pass http://dispatch_service/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;

            proxy_set_header X-Tenant-Id $auth_tenant_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
