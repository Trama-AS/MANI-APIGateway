worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout  65;

    # Logging con correlation ID para trazabilidad distribuida
    log_format json_analytics escape=json '{'
        '"time_local": "$time_local",'
        '"remote_addr": "$remote_addr",'
        '"request_method": "$request_method",'
        '"request_uri": "$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent": "$body_bytes_sent",'
        '"request_time": "$request_time",'
        '"http_referrer": "$http_referer",'
        '"http_user_agent": "$http_user_agent",'
        '"x_correlation_id": "$http_x_correlation_id"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    # DNS embebido de Docker. Con `upstream { server host:port; }` NGINX resuelve
    # el host UNA SOLA VEZ al arrancar: si rules-service/dispatch-service todavía
    # no existen en la red (p. ej. en DEV local sin Java/.NET), NGINX no arranca
    # (D-1). Usar una variable en proxy_pass fuerza resolución en cada request vía
    # este resolver, así el Gateway siempre arranca y esas rutas solo devuelven
    # 502 hasta que el servicio real exista — igual que con cualquier upstream caído.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Generación o propagación de Correlation ID
        set $correlation_id $http_x_correlation_id;
        if ($correlation_id = '') {
            set $correlation_id $request_id;
        }

        # Configuración de CORS transversal
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Correlation-ID, X-Correlation-Id, X-Tenant-Slug, X-Tenant-ID, X-Tenant-Id' always;
        add_header 'X-Correlation-ID' $correlation_id always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Healthcheck del Gateway
        location /health {
            return 200 '{"status":"UP","gateway":"MANI-APIGateway","timestamp":"$time_iso8601"}';
        }

        # 1. Rutas Core (Node.js): Usuarios, Tenants, Perfiles, KYC, Catálogos
        location /api/v1/core/ {
            set $core_upstream http://core-service:3000;
            # proxy_pass con variable NO recorta el prefijo de la location (a
            # diferencia de un proxy_pass literal): hay que reescribir la URI
            # explícitamente o Core recibiría /api/v1/core/health en vez de /health.
            rewrite ^/api/v1/core/(.*)$ /$1 break;
            proxy_pass $core_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # 2. Rutas Rules (Java): Motor de reglas, Tarifas, Ranking de aliados
        location /api/v1/rules/ {
            set $rules_upstream http://rules-service:8080;
            rewrite ^/api/v1/rules/(.*)$ /$1 break;
            proxy_pass $rules_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }

        # 3. Rutas Dispatch (.NET): Emparejamiento, Despacho, Exclusión Concurrente
        location /api/v1/dispatch/ {
            set $dispatch_upstream http://dispatch-service:5000;
            rewrite ^/api/v1/dispatch/(.*)$ /$1 break;
            proxy_pass $dispatch_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
        }
    }
}
